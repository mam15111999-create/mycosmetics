<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a2545">
<title>Mỹ Phẩm Hoàng Hiền – Quản lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* =========== TOKENS =========== */
:root{
  --plum:#4a2545;--plum-soft:#6b3a5e;--rose:#c64f7b;--rose-deep:#a83a63;
  --gold:#c99a4e;--bg:#fbf3f6;--surface:#fffbfc;--surface-2:#f7ebf0;
  --line:#ecd7e0;--ink:#3a2333;--ink-soft:#7d6472;
  --good:#2f9e6b;--good-bg:#e4f4ec;--warn:#c9791f;--warn-bg:#fbeed9;
  --bad:#c53b3b;--bad-bg:#f8e2e2;
  --shadow:0 6px 22px rgba(74,37,69,.11);--shadow-sm:0 2px 8px rgba(74,37,69,.08);
  --radius:16px;--bnav-h:64px;
  color-scheme:light;
}
:root:not([data-theme="light"]){
  @media(prefers-color-scheme:dark){
    --plum:#e9c7dc;--plum-soft:#caa0bb;--rose:#e987ac;--rose-deep:#f0a0bf;--gold:#dcb673;
    --bg:#1c1119;--surface:#271823;--surface-2:#32202c;--line:#432d3b;
    --ink:#f3e6ee;--ink-soft:#b494a8;
    --good:#5bc793;--good-bg:#1e3a2c;--warn:#e0a24a;--warn-bg:#3d2e17;--bad:#ec6d6d;--bad-bg:#3d1e1e;
    --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plum:#e9c7dc;--plum-soft:#caa0bb;--rose:#e987ac;--rose-deep:#f0a0bf;--gold:#dcb673;
  --bg:#1c1119;--surface:#271823;--surface-2:#32202c;--line:#432d3b;
  --ink:#f3e6ee;--ink-soft:#b494a8;
  --good:#5bc793;--good-bg:#1e3a2c;--warn:#e0a24a;--warn-bg:#3d2e17;--bad:#ec6d6d;--bad-bg:#3d1e1e;
  --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.28);color-scheme:dark;
}
/* =========== RESET =========== */
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces","Instrument Sans",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;color:var(--plum)}
button,input,select,textarea{font-family:inherit;font-size:16px}
img{max-width:100%}
.tnum{font-variant-numeric:tabular-nums}
/* =========== LOGIN =========== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px 28px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:18px}
.login-card h1{text-align:center;font-size:24px;margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:28px}
.login-err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
/* =========== LAYOUT =========== */
.app{display:flex;min-height:100%;padding-bottom:0}
.sidebar{
  width:236px;flex-shrink:0;background:var(--plum);color:#fbeef4;
  display:flex;flex-direction:column;gap:5px;
  padding:calc(env(safe-area-inset-top,0px)+22px) 14px 22px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand-mark{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--gold));display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:600;font-size:21px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand-name{font-family:"Fraunces",serif;font-weight:600;font-size:17px;line-height:1.15;color:#fff}
.brand-sub{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#e6b9d0;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#f0d5e4;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .15s,color .15s;min-height:44px}
.nav-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-btn.active{background:var(--surface);color:var(--plum);font-weight:600;box-shadow:var(--shadow-sm)}
.nav-btn .ic{width:20px;text-align:center;font-size:16px}
.nav-spacer{flex:1}
.nav-foot{font-size:11px;color:#d09cba;padding:0 10px;line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,28px);
  display:flex;align-items:center;gap:12px;
}
.topbar h1{font-size:21px}
.topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:clamp(14px,3vw,28px);max-width:1180px;width:100%}
/* =========== BUTTONS =========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;min-height:44px}
.btn:hover{border-color:var(--rose);color:var(--rose-deep)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:var(--rose-deep);border-color:var(--rose-deep)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;min-height:36px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:7px;min-height:30px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);transition:.15s;flex-shrink:0}
.icon-btn:hover{border-color:var(--rose);color:var(--rose-deep)}
.menu-toggle{display:none}
/* =========== STAT CARDS =========== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow-sm)}
.stat .label{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:"Fraunces",serif;font-size:26px;font-weight:600;color:var(--plum);margin-top:8px;line-height:1.1}
.stat .foot{font-size:12px;color:var(--ink-soft);margin-top:5px}
.stat .val.rose{color:var(--rose-deep)}.stat .val.good{color:var(--good)}
/* =========== PANELS =========== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px}.panel-head .btn{margin-left:auto}
.panel-body{padding:8px 18px 16px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
/* =========== TOOLBAR =========== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
select.filter{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
/* =========== TABLE =========== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.prod-cell{display:flex;align-items:center;gap:10px}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface-2);border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;font-size:16px;color:var(--rose)}
.prod-name{font-weight:600;color:var(--ink)}.prod-sku{font-size:12px;color:var(--ink-soft)}
.row-actions{display:flex;gap:5px;justify-content:flex-end}
/* =========== MOBILE CARDS =========== */
.card-list{display:flex;flex-direction:column;gap:11px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.m-card-head{display:flex;align-items:center;gap:11px;padding:14px 14px 10px}
.m-card-head .grow{flex:1;min-width:0}
.m-card-body{padding:0 14px 4px;display:flex;flex-direction:column;gap:0}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.m-row span{color:var(--ink-soft);font-size:13px}
.m-row b,.m-row strong{text-align:right;font-variant-numeric:tabular-nums}
.m-card-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.m-card-foot .btn{flex:1;min-width:0}
/* Txn card */
.txn-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.txn-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.txn-card-top .grow{flex:1;min-width:0}
.txn-card-meta{font-size:13px;color:var(--ink-soft)}
.txn-card-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.txn-card-nums>div{display:flex;flex-direction:column;gap:2px}
.txn-card-nums .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
/* Partner card */
.party-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow-sm)}
.party-card-name{font-weight:700;font-size:16px;margin-bottom:5px}
.party-card-info{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-soft)}
.party-card-info span{display:flex;align-items:center;gap:7px}
.party-card-foot{display:flex;gap:8px;margin-top:12px}
/* =========== PILLS =========== */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.rose{background:var(--surface-2);color:var(--rose-deep)}
.pill.sale{background:var(--good-bg);color:var(--good)}
.pill.purchase{background:#e7eefb;color:#3763b8}
:root[data-theme="dark"] .pill.purchase,:root:not([data-theme="light"]) .pill.purchase{background:#1e2c47;color:#84a9e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.purchase{background:#1e2c47;color:#84a9e8}}
.cat-tag{font-size:12px;color:var(--ink-soft)}
/* =========== EMPTY STATE =========== */
.empty{text-align:center;padding:42px 20px;color:var(--ink-soft)}
.empty .big{font-size:36px;margin-bottom:10px}
.empty h3{color:var(--plum);margin-bottom:6px}
/* =========== CHARTS =========== */
.chart-bars{display:flex;align-items:flex-end;gap:9px;height:170px;padding:8px 2px 0}
.cbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.cbar-track{width:100%;flex:1;display:flex;align-items:flex-end}
.cbar{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--rose),var(--rose-deep));min-height:3px;transition:height .4s}
.cbar-lbl{font-size:11.5px;color:var(--ink-soft)}
.cbar-val{font-size:10.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.top-list{display:flex;flex-direction:column;gap:0}
.top-row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.top-row:last-child{border-bottom:0}
.top-rank{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--rose-deep);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.top-row .grow{flex:1;min-width:0}
.top-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-meta{font-size:12px;color:var(--ink-soft)}
.bar-mini{height:6px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.bar-mini>span{display:block;height:100%;background:var(--rose);border-radius:4px}
/* =========== TOAST =========== */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* =========== ORDER NOTIFICATION =========== */
.order-alert{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#1a7f37,#2da44e);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);animation:slideDown .35s ease;cursor:pointer}
.order-alert:hover{background:linear-gradient(135deg,#166429,#268f43)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.order-alert-ico{font-size:26px;flex-shrink:0}
.order-alert-body{flex:1;min-width:0}
.order-alert-title{font-weight:700;font-size:15px}
.order-alert-sub{font-size:12.5px;opacity:.9;margin-top:2px}
.order-alert-close{font-size:20px;padding:4px 8px;opacity:.8;flex-shrink:0}
.notif-badge{background:#e53935;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:6px;vertical-align:middle;display:inline-block;min-width:16px;text-align:center}
/* =========== FORMS =========== */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--ink-soft);font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--rose)}
.field textarea{resize:vertical;min-height:64px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.calc-note{background:var(--surface-2);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--ink-soft);margin-top:2px}
.img-pick{display:flex;align-items:center;gap:12px}
.img-preview{width:56px;height:56px;border-radius:11px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--rose);font-size:20px;flex-shrink:0}
/* =========== MODAL =========== */
.modal-back{position:fixed;inset:0;background:rgba(58,35,51,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-head{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h2{font-size:18px}.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
/* =========== MISC =========== */
.backup-area{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--ink-soft)}
.danger-zone{border:1px solid var(--bad);border-radius:12px;padding:13px 15px;margin-top:10px}
.danger-zone h3{color:var(--bad);font-size:15px;margin-bottom:5px}
.seg-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
.seg-tab{flex:1;padding:10px 8px;border:0;background:var(--surface);color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.seg-tab.active{background:var(--plum);color:#fff}
/* =========== BILL / POS =========== */
.disc-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.disc-toggle button{border:0;background:var(--surface);color:var(--ink-soft);padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.disc-toggle button.active{background:var(--plum);color:#fff}
.bill-summary{background:var(--surface-2);border-radius:12px;padding:13px 15px;margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bill-summary .s-row{display:flex;justify-content:space-between;align-items:center}
.bill-summary .s-total{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.bill-cart-table{width:100%;border-collapse:collapse;min-width:auto}
.bill-cart-table th{padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;background:var(--surface-2);text-align:left}
.bill-cart-table td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.bill-cart-table th.r,.bill-cart-table td.r{text-align:right}
/* =========== QR =========== */
.qr-video-wrap{position:relative;width:100%;max-width:290px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1}
.qr-video-wrap video{display:block;width:100%;height:100%;object-fit:cover}
.qr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:170px;height:170px;border:2px solid var(--rose);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);position:relative;overflow:hidden}
.qr-scan-line{position:absolute;left:0;right:0;height:2px;background:var(--rose);opacity:.9;animation:scanline 1.6s ease-in-out infinite}
@keyframes scanline{0%{top:10%}50%{top:90%}100%{top:10%}}
.qr-status{text-align:center;margin-top:12px;font-size:13.5px;color:var(--ink-soft);min-height:20px}
.qr-found{color:var(--good);font-weight:600}
.qr-gen-wrap{display:inline-block;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
/* =========== STORE =========== */
.store-wrap{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.store-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px clamp(14px,4vw,32px);display:flex;align-items:center;gap:12px}
.store-header .brand-mark{width:36px;height:36px;border-radius:10px;font-size:18px}
.store-header h1{font-size:19px;flex:1}
.cart-btn{position:relative;border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:20px;transition:.15s}
.cart-btn:hover{border-color:var(--rose);color:var(--rose-deep)}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;width:19px;height:19px;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center;display:none}
.store-hero{background:linear-gradient(135deg,var(--plum) 0%,var(--rose-deep) 100%);color:#fff;padding:28px clamp(14px,4vw,32px);text-align:center}
.store-hero h2{font-size:26px;color:#fff;margin-bottom:6px}

.store-content{padding:clamp(14px,3vw,28px);flex:1;padding-bottom:100px}

.cat-btn:hover,.cat-btn.active{background:var(--rose);border-color:var(--rose);color:#fff}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
@media(max-width:480px){.store-grid{grid-template-columns:1fr 1fr;gap:10px}}
.sp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.sp-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sp-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:36px;color:var(--rose)}
.sp-img img{width:100%;height:100%;object-fit:cover}
.sp-body{padding:11px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.sp-name{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-cat{font-size:11.5px;color:var(--ink-soft)}
.sp-price{font-family:"Fraunces",serif;font-size:18px;font-weight:600;color:var(--rose-deep);margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.sp-foot{padding:0 12px 12px;display:flex;gap:8px;align-items:center}
.sp-qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sp-qty button{width:34px;height:34px;border:0;background:var(--surface-2);cursor:pointer;font-size:17px;font-weight:700;color:var(--ink);transition:.12s;flex-shrink:0}
.sp-qty button:active{background:var(--rose);color:#fff}
.sp-qty-val{min-width:32px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:0 4px}
.add-btn{flex:1;background:var(--rose);border:0;color:#fff;border-radius:9px;padding:9px 10px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.add-btn:hover{background:var(--rose-deep)}
.add-btn.added{background:var(--good)}
.out-badge{width:100%;text-align:center;padding:8px;font-size:13px;color:var(--ink-soft);font-weight:600}
/* Cart bar */
.cart-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--plum);color:#fff;padding:14px clamp(14px,4vw,32px) calc(env(safe-area-inset-bottom,0px)+14px);display:flex;align-items:center;gap:14px;transform:translateY(100%);transition:transform .25s;box-shadow:0 -4px 20px rgba(74,37,69,.25)}
.cart-bar.show{transform:translateY(0)}
.cart-bar-info{flex:1;min-width:0}
.cart-bar-count{font-size:13px;opacity:.8}
.cart-bar-total{font-family:"Fraunces",serif;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cart-bar-btn{background:var(--rose);border:0;color:#fff;padding:13px 22px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.cart-bar-btn:active{background:var(--rose-deep)}
/* Cart sheet */
.cart-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cart-item:last-child{border-bottom:0}

.cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;border-top:2px solid var(--line);margin-top:4px;font-weight:700}
.cart-total-row .amount{font-family:"Fraunces",serif;font-size:22px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
/* =========== POINTS BADGE =========== */
.pts-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#ffe066,#f5a623);color:#5a3a00;padding:3px 9px;border-radius:100px;font-size:12px;font-weight:700}
.pts-info-box{background:linear-gradient(135deg,#fff8e1,#fff3cd);border:1px solid #f5c842;border-radius:10px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:8px;margin-top:6px}
/* =========== BOTTOM NAV (ẩn hoàn toàn) =========== */

  display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+18px);right:18px;
  width:54px;height:54px;border-radius:50%;background:var(--rose);color:#fff;border:0;
  font-size:26px;box-shadow:0 4px 16px rgba(198,79,123,.5);cursor:pointer;z-index:38;
  display:grid;place-items:center;transition:.18s;
}
.fab:active{transform:scale(.93)}
/* =========== MENU TOGGLE (nút ☰ topbar) =========== */
.menu-toggle{
  width:40px;height:40px;border-radius:11px;background:var(--plum);color:#fff;

  flex-shrink:0;transition:.15s;
}
.menu-toggle:hover{opacity:.85}
/* =========== RESPONSIVE =========== */
@media(max-width:860px){.two-col{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}

  .sidebar{display:none}

  /* Bottom sheet modal */

<script>
"use strict";
/* ======= AUTH ======= */
const AUTH_KEY="myphamHH_auth";
const DB_KEY="myphamHH_v1";
const THEME_KEY="myphamHH_theme";
const DEFAULT_AUTH={username:"admin",password:"admin"};

function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY+"_cred"))||DEFAULT_AUTH;}catch(e){return DEFAULT_AUTH;}}
function isLoggedIn(){try{return sessionStorage.getItem(AUTH_KEY)==="1";}catch(e){return false;}}
function doLogin(user,pass){
  const cred=getAuth();
  return user.trim()===cred.username&&pass===cred.password;
}
function logout(){try{sessionStorage.removeItem(AUTH_KEY);}catch(e){}showLogin();}

function showLogin(){
  document.getElementById("loginWrap").hidden=false;
  document.getElementById("appWrap").hidden=true;
}
function showApp(){
  document.getElementById("loginWrap").hidden=true;
  document.getElementById("appWrap").hidden=false;
}

/* login form */
document.getElementById("lBtn").onclick=function(){
  const u=document.getElementById("lUser").value;
  const p=document.getElementById("lPass").value;
  if(!u||!p){showErr("Vui lòng nhập đủ thông tin.");return;}
  if(doLogin(u,p)){
    try{sessionStorage.setItem(AUTH_KEY,"1");}catch(e){}
    showApp();seed();go("dashboard");
  } else {
    showErr("Sai tên đăng nhập hoặc mật khẩu.");
    document.getElementById("lPass").value="";
    document.getElementById("lPass").focus();
  }
};
["lUser","lPass"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("lBtn").click();}));
function showErr(msg){const e=document.getElementById("lErr");e.hidden=false;e.textContent=msg;}

/* ======= DATA ======= */
const DEFAULT={products:[],suppliers:[],customers:[],transactions:[],bills:[],categories:[],seeded:false};
let DB=loadDB();
function loadDB(){try{const r=localStorage.getItem(DB_KEY);if(r)return Object.assign({},DEFAULT,JSON.parse(r));}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){toast("Không lưu được dữ liệu");}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ======= SEED ======= */
function seed(){
  if(DB.seeded||DB.products.length)return;
  const s1=uid(),s2=uid();
  DB.suppliers=[
    {id:s1,name:"Mỹ phẩm Sài Gòn Dist.",phone:"0908 123 456",address:"Quận 5, TP.HCM",note:"Giao hàng 2 ngày"},
    {id:s2,name:"Korea Beauty Import",phone:"0912 888 777",address:"Hà Nội",note:"Hàng nhập Hàn Quốc"},
  ];
  const c1=uid();
  DB.customers=[
    {id:c1,name:"Chị Lan (khách quen)",phone:"0977 555 222",address:"Bình Thạnh",note:"Thích son lì"},
    {id:uid(),name:"Khách lẻ",phone:"",address:"",note:"Khách vãng lai"},
  ];
  const p1=uid(),p2=uid(),p3=uid(),p4=uid(),p5=uid();
  DB.products=[
    {id:p1,name:"Son kem lì Black Rouge A02",sku:"SON-A02",category:"Son môi",cost:75000,price:145000,stock:24,lowStock:6,supplierId:s2,image:"",note:""},
    {id:p2,name:"Kem chống nắng Anessa 60ml",sku:"KCN-ANE",category:"Chống nắng",cost:320000,price:480000,stock:8,lowStock:5,supplierId:s2,image:"",note:""},
    {id:p3,name:"Nước tẩy trang L'Oreal 400ml",sku:"TT-LOR",category:"Tẩy trang",cost:110000,price:189000,stock:4,lowStock:6,supplierId:s1,image:"",note:"Sắp hết"},
    {id:p4,name:"Mặt nạ giấy Mediheal (hộp 10)",sku:"MN-MED",category:"Mặt nạ",cost:130000,price:220000,stock:15,lowStock:5,supplierId:s2,image:"",note:""},
    {id:p5,name:"Phấn phủ kiềm dầu Innisfree",sku:"PH-INN",category:"Trang điểm",cost:145000,price:245000,stock:11,lowStock:4,supplierId:s1,image:"",note:""},
  ];
  const today=new Date();
  const d=n=>{const x=new Date(today);x.setDate(x.getDate()-n);return x.toISOString().slice(0,10);};
  DB.transactions=[
    {id:uid(),type:"purchase",date:d(40),productId:p1,qty:30,unitPrice:75000,unitCost:75000,partyId:s2,note:"Nhập lô đầu"},
    {id:uid(),type:"sale",date:d(20),productId:p1,qty:6,unitPrice:145000,unitCost:75000,partyId:c1,note:""},
    {id:uid(),type:"sale",date:d(12),productId:p2,qty:2,unitPrice:480000,unitCost:320000,partyId:c1,note:""},
    {id:uid(),type:"sale",date:d(8),productId:p4,qty:3,unitPrice:220000,unitCost:130000,partyId:c1,note:""},
    {id:uid(),type:"sale",date:d(3),productId:p1,qty:4,unitPrice:145000,unitCost:75000,partyId:c1,note:""},
    {id:uid(),type:"sale",date:d(1),productId:p5,qty:2,unitPrice:245000,unitCost:145000,partyId:c1,note:""},
  ];
  DB.seeded=true;save();
}

/* ======= UTILS ======= */
const fmt=n=>(Math.round(n||0)).toLocaleString("vi-VN");
const money=n=>fmt(n)+"₫";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
const isMob=()=>window.innerWidth<=720;
const supplierName=id=>(byId(DB.suppliers,id)||{}).name||"—";
const customerName=id=>(byId(DB.customers,id)||{}).name||"—";
const productById=id=>byId(DB.products,id);
function stockStatus(p){if(p.stock<=0)return{cls:"bad",txt:"Tạm hết hàng"};if(p.stock<=p.lowStock)return{cls:"warn",txt:"Sắp hết"};return{cls:"good",txt:"Còn hàng"};}
function margin(p){if(!p.price)return 0;return(p.price-p.cost)/p.price*100;}
function thumbHtml(p,sz=40){if(p.image)return`<img class="thumb" src="${p.image}" alt="" style="width:${sz}px;height:${sz}px">`;return`<div class="thumb ph" style="width:${sz}px;height:${sz}px">✦</div>`;}
function fmtDate(d){const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;}

let toastTm;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTm);toastTm=setTimeout(()=>t.classList.remove("show"),2700);}

/* ======= ROUTER ======= */
const VIEWS={
  dashboard:{title:"Tổng quan",sub:"Bức tranh tổng thể cửa hàng",render:renderDashboard},
  products:{title:"Mặt hàng & tồn kho",sub:"Sản phẩm, giá nhập/bán, tồn kho",render:renderProducts},
  salesPos:{title:"Bán hàng",sub:"Lập hóa đơn, tính tiền, giảm giá",render:renderSalesPos},
  purchases:{title:"Nhập hàng",sub:"Nhập kho từ nhà cung cấp",render:renderPurchases},
  transactions:{title:"Lịch sử giao dịch",sub:"Toàn bộ nhập & bán hàng",render:renderTransactions},
  suppliers:{title:"Nhà cung cấp",sub:"Nguồn nhập hàng",render:()=>renderPartyList("supplier",DB.suppliers,"nhà cung cấp","☍")},
  customers:{title:"Khách hàng",sub:"Thông tin khách mua hàng",render:()=>renderPartyList("customer",DB.customers,"khách hàng","☺")},
  partners:{title:"Đối tác",sub:"Nhà cung cấp & khách hàng",render:renderPartners},
  categories:{title:"Danh mục hàng",sub:"Phân loại sản phẩm theo nhóm",render:renderCategories},
  settings:{title:"Cài đặt",sub:"Tài khoản, sao lưu, giao diện",render:renderSettings},
};
let current="dashboard", partnerTab="supplier";

function go(view){
  current=view;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  document.querySelectorAll(".bnav-btn").forEach(b=>{
    const v=b.dataset.view;
    b.classList.toggle("active",v===view||(view==="suppliers"&&v==="partners")||(view==="customers"&&v==="partners"));
  });
  const v=VIEWS[view]||VIEWS.dashboard;
  document.getElementById("viewTitle").textContent=v.title;
  document.getElementById("viewSub").textContent=v.sub||"";
  document.getElementById("topActions").innerHTML="";
  document.getElementById("content").innerHTML="";
  updateFAB(view);
  v.render();
  window.scrollTo(0,0);
  closeScrim();
  if(view==="transactions"){
    if(typeof unreadCount!=="undefined"){unreadCount=0;if(typeof updateBadge==="function")updateBadge();}
    try{localStorage.setItem("myphamHH_lastSeen",Date.now());}catch(e){}
  }
}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
document.getElementById("addProdNavBtn")?.addEventListener("click",()=>{
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("addProdNavBtn").classList.add("active");
  go("products");
  setTimeout(()=>openProductModal(),50);
});

function topBtn(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.innerHTML=label;b.onclick=fn;document.getElementById("topActions").appendChild(b);return b;}

/* FAB behaviour */
function updateFAB(view){
  const fab=document.getElementById("fab");
  if(view==="dashboard"||view==="salesPos"){fab.textContent="＋";fab.title="Lập hóa đơn";fab.onclick=()=>openBillModal();}
  else if(view==="purchases"||view==="transactions"){fab.textContent="＋";fab.title="Nhập hàng";fab.onclick=()=>openTxnModal("purchase");}
  else if(view==="products"){fab.textContent="＋";fab.title="Thêm mặt hàng";fab.onclick=()=>openProductModal();topBtn("📷","ghost",()=>scanAndFetchProduct());}

/* ======= DASHBOARD ======= */
function computeStats(){
  const prods=DB.products;
  const inv=prods.reduce((s,p)=>s+p.cost*p.stock,0);
  const retail=prods.reduce((s,p)=>s+p.price*p.stock,0);
  const lowCount=prods.filter(p=>p.stock>0&&p.stock<=p.lowStock).length;
  const outCount=prods.filter(p=>p.stock<=0).length;
  const sales=DB.transactions.filter(t=>t.type==="sale");
  const bills=DB.bills||[];
  const revenue=sales.reduce((s,t)=>s+t.qty*t.unitPrice,0)+bills.reduce((s,b)=>s+b.total,0);
  const profit=sales.reduce((s,t)=>s+t.qty*(t.unitPrice-t.unitCost),0)+bills.reduce((s,b)=>s+b.profit,0);
  const unitsSold=sales.reduce((s,t)=>s+t.qty,0)+bills.reduce((s,b)=>s+b.items.reduce((ss,i)=>ss+i.qty,0),0);
  return{inv,retail,lowCount,outCount,revenue,profit,unitsSold};
}
function renderDashboard(){
  if(!isMob()){topBtn("＋ Lập hóa đơn","primary",()=>openBillModal());topBtn("＋ Nhập hàng","ghost",()=>openTxnModal("purchase"));}

      <div class="stat"><div class="label">⚠️ Cần nhập thêm</div><div class="val">${s.lowCount+s.outCount}</div><div class="foot">${s.outCount} hết · ${s.lowCount} sắp hết</div></div>

function renderRevChart(el){
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.toISOString().slice(0,7),lbl:"T"+(d.getMonth()+1)});}
  const map={};months.forEach(m=>map[m.key]=0);
  DB.transactions.filter(t=>t.type==="sale").forEach(t=>{const k=t.date.slice(0,7);if(k in map)map[k]+=t.qty*t.unitPrice;});
  const max=Math.max(1,...months.map(m=>map[m.key]));
  if(!DB.transactions.filter(t=>t.type==="sale").length){el.innerHTML=`<div class="empty"><div class="big">📊</div>Chưa có dữ liệu bán hàng</div>`;return;}
  el.innerHTML=`<div class="chart-bars">${months.map(m=>{const v=map[m.key];const h=Math.max(3,v/max*100);return`<div class="cbar-wrap"><div class="cbar-val">${v?fmt(v/1000)+"k":""}</div><div class="cbar-track"><div class="cbar" style="height:${h}%"></div></div><div class="cbar-lbl">${m.lbl}</div></div>`;}).join("")}</div>`;
}
function renderTopProducts(el){
  const agg={};DB.transactions.filter(t=>t.type==="sale").forEach(t=>{if(!agg[t.productId])agg[t.productId]={qty:0,rev:0};agg[t.productId].qty+=t.qty;agg[t.productId].rev+=t.qty*t.unitPrice;});
  const rows=Object.entries(agg).map(([id,v])=>({p:productById(id),...v})).filter(r=>r.p).sort((a,b)=>b.rev-a.rev).slice(0,5);
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">🏆</div>Chưa có dữ liệu</div>`;return;}
  const max=rows[0].rev;
  el.innerHTML=`<div class="top-list">${rows.map((r,i)=>`<div class="top-row"><div class="top-rank">${i+1}</div><div class="grow"><div class="top-name">${esc(r.p.name)}</div><div class="top-meta">${fmt(r.qty)} đã bán · ${money(r.rev)}</div><div class="bar-mini"><span style="width:${r.rev/max*100}%"></span></div></div></div>`).join("")}</div>`;
}

function delTxn(id){
  const t=byId(DB.transactions,id);if(!t)return;
  confirmModal("Xoá giao dịch?","Xoá giao dịch này sẽ hoàn lại tồn kho. Tiếp tục?",()=>{
    const p=productById(t.productId);
    if(p){if(t.type==="sale")p.stock+=t.qty;else{p.stock-=t.qty;if(p.stock<0)p.stock=0;}}
    DB.transactions=DB.transactions.filter(x=>x.id!==id);save();toast("Đã xoá giao dịch");go(current);
  });
}

function lookupPhone(phone){
  const box=document.getElementById("bPhoneBox");
  const sel=document.getElementById("bCust");
  if(!box)return;
  const clean=phone.replace(/\s|-/g,"");
  if(!clean||clean.length<6){box.innerHTML="";return;}
  const cust=DB.customers.find(c=>c.phone&&c.phone.replace(/\s|-/g,"").includes(clean));
  if(cust){
    if(sel)sel.value=cust.id;
    box.innerHTML=`<div class="pts-info-box">⭐ <b>${esc(cust.name)}</b> · Điểm hiện có: <span class="pts-badge">⭐ ${fmt(cust.points||0)} điểm</span></div>`;
  } else {
    box.innerHTML=`<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">Không tìm thấy — bấm <b>＋ Thêm KH</b> để tạo mới.</div>`;
  }
}
function onBillCustChange(){
  const sel=document.getElementById("bCust");
  const box=document.getElementById("bPhoneBox");
  if(!sel||!box)return;
  const cust=byId(DB.customers,sel.value);
  if(cust){
    const ph=document.getElementById("bPhone");
    if(ph&&!ph.value&&cust.phone)ph.value=cust.phone;
    box.innerHTML=`<div class="pts-info-box">⭐ <b>${esc(cust.name)}</b> · Điểm hiện có: <span class="pts-badge">⭐ ${fmt(cust.points||0)} điểm</span></div>`;
  } else {
    box.innerHTML="";
  }
}
function addCustFromPhone(){
  const ph=document.getElementById("bPhone");
  const phone=ph?ph.value.trim():"";
  openPartyModal("customer",null,phone,id=>{
    const sel=document.getElementById("bCust");
    if(sel){
      // rebuild options
      const opts=`<option value="">— Khách lẻ —</option>`+DB.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
      sel.innerHTML=opts;
      sel.value=id;
      onBillCustChange();
    }
  });
}
function setDiscType(type){
  billDiscType=type;
  document.getElementById("dPct").classList.toggle("active",type==="percent");
  document.getElementById("dAmt").classList.toggle("active",type==="amount");
  updateBillSummary();
}
function billAddItem(){
  const p=productById(document.getElementById("bProd").value);
  if(!p){toast("Chọn sản phẩm");return;}
  const qty=Math.max(1,+document.getElementById("bQty").value||1);
  const unitPrice=+document.getElementById("bUPrice").value||p.price;
  const existing=billCart.find(i=>i.productId===p.id);
  if(existing){existing.qty+=qty;existing.unitPrice=unitPrice;}
  else billCart.push({productId:p.id,qty,unitPrice,unitCost:p.cost});
  // clamp to stock
  const totalQty=billCart.filter(i=>i.productId===p.id).reduce((s,i)=>s+i.qty,0);
  if(totalQty>p.stock){const ci=billCart.find(i=>i.productId===p.id);if(ci)ci.qty=Math.max(1,p.stock-billCart.filter(i=>i.productId===p.id&&i!==ci).reduce((s,i)=>s+i.qty,0));toast(`⚠️ Kho chỉ còn ${p.stock}`);}
  document.getElementById("bQty").value=1;
  renderBillCart();
}
function billScanQR(){
  openQRScanner(code=>{
    const found=DB.products.find(p=>p.id===code||(p.sku&&p.sku===code));
    if(found){
      const existing=billCart.find(i=>i.productId===found.id);
      if(existing&&existing.qty<found.stock){existing.qty++;renderBillCart();toast(`✓ +1 ${found.name}`);}
      else if(!existing){billCart.push({productId:found.id,qty:1,unitPrice:found.price,unitCost:found.cost});renderBillCart();toast(`✓ Đã thêm: ${found.name}`);}
      else toast(`⚠️ Kho chỉ còn ${found.stock}`);
    } else toast("Không tìm thấy sản phẩm với mã QR này");
  });
}
function billPickProduct(){
  const prods=DB.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"vi"));
  mountModal(`<div class="modal" style="max-width:580px">
    <div class="modal-head"><h2>📋 Chọn sản phẩm</h2><button class="icon-btn" onclick="_renderBillModal()">✕</button></div>
    <div class="modal-body" style="padding-bottom:8px">
      <div class="search" style="margin-bottom:14px"><span class="mag">🔍</span><input id="ppQ" placeholder="Tìm tên, loại sản phẩm..." oninput="filterPickerProds(this.value)" autocomplete="off"></div>
      <div id="ppGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;max-height:55vh;overflow-y:auto;padding-bottom:4px"></div>
    </div>
    <div class="modal-foot"><button class="btn primary" style="flex:1" onclick="_renderBillModal()">✓ Xong (${billCart.length} mặt hàng)</button></div>
  </div>`);
  renderPickerGrid(prods);
}
function filterPickerProds(q){
  const ql=q.toLowerCase();
  const prods=DB.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"vi"))
    .filter(p=>!ql||(p.name||"").toLowerCase().includes(ql)||(p.category||"").toLowerCase().includes(ql)||(p.sku||"").toLowerCase().includes(ql));
  renderPickerGrid(prods);
}
function renderPickerGrid(prods){
  const grid=document.getElementById("ppGrid");if(!grid)return;
  if(!prods.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:20px"><p class="muted">Không tìm thấy</p></div>`;return;}
  grid.innerHTML=prods.map(p=>{
    const inCart=billCart.find(i=>i.productId===p.id);
    const out=p.stock<=0;
    return`<div style="background:var(--surface);border:2px solid ${inCart?"var(--rose)":"var(--line)"};border-radius:12px;padding:10px;cursor:${out?"default":"pointer"};opacity:${out?.6:1};transition:.12s" ${out?"":` onclick="billAddFromPicker('${p.id}')"`}>
      <div style="font-weight:600;font-size:13px;line-height:1.35;margin-bottom:3px">${esc(p.name)}</div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:5px">${esc(p.category||"")}</div>
      <div style="font-weight:700;color:var(--rose-deep);font-size:15px">${money(p.price)}</div>
      <div style="font-size:11.5px;color:${p.stock<=p.lowStock?"var(--warn)":"var(--ink-soft)"};margin-top:2px">Còn ${p.stock}</div>
      ${inCart?`<div style="margin-top:7px;display:flex;align-items:center;gap:6px">
        <button style="width:26px;height:26px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;cursor:pointer;font-size:16px;font-weight:700;line-height:1" onclick="event.stopPropagation();billPickQty('${p.id}',-1)">−</button>
        <span style="font-weight:700;font-size:14px;min-width:20px;text-align:center">${inCart.qty}</span>
        <button style="width:26px;height:26px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;cursor:pointer;font-size:16px;font-weight:700;line-height:1" onclick="event.stopPropagation();billPickQty('${p.id}',1)">＋</button>
        <span style="font-size:12px;color:var(--rose-deep);margin-left:2px">${money(inCart.qty*inCart.unitPrice)}</span>
      </div>`:`<div style="margin-top:8px;background:var(--rose);color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;text-align:center">${out?"Hết hàng":"＋ Thêm"}</div>`}
    </div>`;
  }).join("");
}
function billAddFromPicker(productId){
  const p=productById(productId);if(!p||p.stock<=0)return;
  const existing=billCart.find(i=>i.productId===p.id);
  if(existing){if(existing.qty<p.stock)existing.qty++;else{toast(`⚠️ Kho chỉ còn ${p.stock}`);return;}}
  else billCart.push({productId:p.id,qty:1,unitPrice:p.price,unitCost:p.cost});
  filterPickerProds(document.getElementById("ppQ")?.value||"");
  // update Xong button count
  const xongBtn=document.querySelector(".modal-foot .btn.primary");
  if(xongBtn)xongBtn.textContent=`✓ Xong (${billCart.reduce((s,i)=>s+i.qty,0)} sản phẩm)`;
}
function billPickQty(productId,delta){
  const item=billCart.find(i=>i.productId===productId);if(!item)return;
  const p=productById(productId);
  item.qty+=delta;
  if(item.qty<=0){billCart=billCart.filter(i=>i.productId!==productId);}
  else if(p&&item.qty>p.stock){item.qty=p.stock;toast(`⚠️ Kho chỉ còn ${p.stock}`);}
  filterPickerProds(document.getElementById("ppQ")?.value||"");
  const xongBtn=document.querySelector(".modal-foot .btn.primary");
  if(xongBtn)xongBtn.textContent=`✓ Xong (${billCart.reduce((s,i)=>s+i.qty,0)} sản phẩm)`;
}
function billRemoveItem(idx){billCart.splice(idx,1);renderBillCart();}
function billUpdateQty(idx,val){
  const item=billCart[idx];if(!item)return;
  const p=productById(item.productId);
  item.qty=Math.max(1,+val||1);
  if(p&&item.qty>p.stock){item.qty=p.stock;toast(`Kho chỉ còn ${p.stock}`);}
  updateBillSummary();
  // re-render price cell
  const cell=document.getElementById("bcell_"+idx);
  if(cell)cell.textContent=money(item.qty*item.unitPrice);
}
function renderBillCart(){
  const wrap=document.getElementById("billCartWrap");if(!wrap)return;
  const addRow=`<tr style="background:var(--surface-2)">
    <td colspan="4" style="padding:10px 12px;text-align:center">
      <button class="btn ghost" onclick="billPickProduct()" style="margin-right:8px;font-size:13px">📋 Chọn sản phẩm</button>
      <button class="btn ghost" onclick="billScanQR()" style="font-size:13px">📷 Quét mã vạch / QR</button>
    </td>
  </tr>`;
  wrap.innerHTML=`<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:2px">
    <table class="bill-cart-table">
      <thead><tr><th>Sản phẩm</th><th style="text-align:center">SL</th><th class="r">Thành tiền</th><th style="width:80px"></th></tr></thead>
      <tbody>
        ${billCart.map((item,i)=>{
          const p=productById(item.productId);
          return`<tr><td><div style="font-weight:600;font-size:13px">${esc(p?p.name:"?")}</div><div style="font-size:12px;color:var(--ink-soft)">${money(item.unitPrice)}/cái</div></td><td style="width:72px;text-align:center"><input type="number" min="1" value="${item.qty}" style="width:60px;text-align:center;padding:5px 4px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-weight:600;background:var(--bg);color:var(--ink)" onchange="billUpdateQty(${i},this.value)"></td><td class="r" id="bcell_${i}" style="font-weight:700;font-variant-numeric:tabular-nums">${money(item.qty*item.unitPrice)}</td><td style="width:36px;padding:4px 6px;text-align:center"><button style="width:28px;height:28px;border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:16px;border-radius:6px;line-height:1" onclick="billRemoveItem(${i})">✕</button></td></tr>`;
        }).join("")}
        ${addRow}
      </tbody>
    </table>
  </div>`;
  updateBillSummary();
}
function onBillProdSelectChange(){
  const sel=document.getElementById("bProd");
  const pi=document.getElementById("bUPrice");
  if(!sel||!pi)return;
  const p=productById(sel.value);if(p)pi.value=p.price;
}
function getBillCalc(){
  const subtotal=billCart.reduce((s,i)=>s+i.qty*i.unitPrice,0);
  const d=+((document.getElementById("bDisc")||{}).value)||0;
  const discAmt=billDiscType==="percent"?Math.round(subtotal*d/100):d;
  const total=Math.max(0,subtotal-discAmt);
  const cost=billCart.reduce((s,i)=>s+i.qty*i.unitCost,0);
  return{subtotal,discAmt,total,profit:total-cost};
}
function updateBillSummary(){
  const el=document.getElementById("billSummary");if(!el)return;
  if(!billCart.length){el.innerHTML="";return;}
  const {subtotal,discAmt,total,profit}=getBillCalc();
  el.innerHTML=`<div class="s-row"><span style="color:var(--ink-soft)">Tạm tính:</span><span>${money(subtotal)}</span></div>${discAmt?`<div class="s-row" style="color:var(--warn)"><span>Giảm giá:</span><span>-${money(discAmt)}</span></div>`:""}<div class="s-row s-total"><span>Tổng cộng:</span><span style="color:var(--rose-deep)">${money(total)}</span></div>`;
}
function saveBill(){
  if(!billCart.length){toast("Chưa có sản phẩm trong hóa đơn");return;}
  const {subtotal,discAmt,total,profit}=getBillCalc();
  const d=+document.getElementById("bDisc").value||0;
  for(const item of billCart){const p=productById(item.productId);if(p)p.stock=Math.max(0,p.stock-item.qty);}
  if(!DB.bills)DB.bills=[];
  DB.bills.push({id:uid(),date:document.getElementById("bDate").value||new Date().toISOString().slice(0,10),customerId:document.getElementById("bCust").value,items:billCart.map(i=>({...i})),discount:d,discountType:billDiscType,note:document.getElementById("bNote").value.trim(),subtotal,discAmt,total,profit});
  billCart=[];
  // Tích điểm cho khách hàng (1 điểm / 10,000₫)
  const custId=document.getElementById("bCust").value;
  let toastMsg=`✓ Đã lưu hóa đơn ${money(total)}`;
  if(custId){
    const cust=byId(DB.customers,custId);
    if(cust){
      const earned=Math.floor(total/10000);
      cust.points=(cust.points||0)+earned;
      if(!cust.pointsHistory)cust.pointsHistory=[];
      cust.pointsHistory.push({date:document.getElementById("bDate").value,billId:DB.bills[DB.bills.length-1].id,earned,balance:cust.points});
      if(earned>0)toastMsg+=` · Tích +${fmt(earned)} điểm`;
    }
  }
  save();closeModal();toast(toastMsg);go(current);
}
function delBill(id){
  const b=byId(DB.bills||[],id);if(!b)return;
  confirmModal("Xoá hóa đơn?","Xoá sẽ hoàn lại tồn kho cho các sản phẩm. Tiếp tục?",()=>{
    for(const item of b.items){const p=productById(item.productId);if(p)p.stock+=item.qty;}

/* ======= MODALS ======= */
function mountModal(html){
  const m=document.getElementById("modalMount");
  m.innerHTML=`<div class="modal-back" id="mBack">${html}</div>`;
  const back=document.getElementById("mBack");
  // Desktop: click backdrop to close
  back.addEventListener("mousedown",e=>{if(e.target.id==="mBack")closeModal();});
  // Mobile: backdrop close only when tap didn't move (not accidental scroll)
  let _bkMoved=false;
  back.addEventListener("touchstart",()=>{_bkMoved=false;},{passive:true});
  back.addEventListener("touchmove",()=>{_bkMoved=true;},{passive:true});
  back.addEventListener("touchend",e=>{if(!_bkMoved&&e.target.id==="mBack")closeModal();},{passive:true});
  // Bottom sheet swipe-down: only close on deliberate downward swipe (≥130px, mostly vertical)
  if(isMob()){
    const modal=back.querySelector(".modal");
    if(modal){
      let _sy=0,_sx=0,_scrolled=false;
      modal.addEventListener("touchstart",e=>{_sy=e.touches[0].clientY;_sx=e.touches[0].clientX;_scrolled=false;},{passive:true});
      modal.addEventListener("touchmove",e=>{if(Math.abs(e.touches[0].clientX-_sx)>Math.abs(e.touches[0].clientY-_sy))_scrolled=true;},{passive:true});
      modal.addEventListener("touchend",e=>{
        if(_scrolled)return;
        const dy=e.changedTouches[0].clientY-_sy,dx=Math.abs(e.changedTouches[0].clientX-_sx);
        if(dy>130&&dx<70)closeModal();
      },{passive:true});
    }
  }
}
function closeModal(){if(_qrOpen){stopQR();return;}document.getElementById("modalMount").innerHTML="";}
window.closeModal=closeModal;

function confirmModal(title,body,onYes){
  mountModal(`<div class="modal" style="max-width:400px">
    <div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>

}

/* ======= QR ======= */
let qrStream=null,qrAF=null,qrZXReader=null,_qrFoundCb=null,_qrOpen=false,_qrPrevModal=null,qrSession=0;
let _bdPromise=null,_bdKind="";
const BD_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code","data_matrix"];

function loadZXingLib(){
  if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return Promise.resolve(window.ZXing);
  return new Promise(resolve=>{
    const s=document.createElement("script");
    // v0.18.6: BrowserMultiFormatReader vẫn còn trong package chính
    s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js";
    s.onload=()=>resolve((window.ZXing&&window.ZXing.BrowserMultiFormatReader)?window.ZXing:null);
    s.onerror=()=>resolve(null);
    document.head.appendChild(s);
  });
}

// Android/macOS có BarcodeDetector sẵn; iPhone/Windows dùng ZXing-C++ (WebAssembly) qua cùng API
function getBarcodeDetector(){
  if(_bdPromise)return _bdPromise;
  _bdPromise=(async()=>{
    if("BarcodeDetector" in window){
      try{
        const sup=await BarcodeDetector.getSupportedFormats();
        if(sup.includes("ean_13")){_bdKind="native";return new BarcodeDetector({formats:BD_FORMATS.filter(f=>sup.includes(f))});}
      }catch(e){}
    }
    try{
      const m=await import("https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/es/pure.min.js");
      const det=new m.BarcodeDetector({formats:BD_FORMATS});
      const warm=document.createElement("canvas");warm.width=warm.height=8;
      await det.detect(warm);
      _bdKind="wasm";return det;
    }catch(e){_bdPromise=null;return null;}
  })();
  return _bdPromise;
}

function openQRScanner(onFound){
  // Tách form đang mở (Nhập hàng, Thêm sản phẩm…) ra để trả lại nguyên vẹn khi đóng màn hình quét
  if(_qrOpen)stopQR(false);
  else{const m=document.getElementById("modalMount");_qrPrevModal=m.firstElementChild;if(_qrPrevModal)_qrPrevModal.remove();}
  _qrOpen=true;_qrFoundCb=onFound;
  const sid=++qrSession;
  const alive=()=>sid===qrSession&&!!document.getElementById("qrVid");
  const touch=isMob()||matchMedia("(pointer:coarse)").matches;
  getBarcodeDetector();
  mountModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><h2>📷 Quét mã vạch / QR</h2><button class="icon-btn" onclick="stopQR()">✕</button></div>
    <div class="modal-body" style="padding:12px;text-align:center">
      <div id="qrBox" style="position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:50vh">
        <video id="qrVid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
          <div class="qr-frame"><div class="qr-scan-line"></div></div>
        </div>
      </div>
      <div id="qrStat" style="margin:10px 0 4px;font-size:13px;min-height:36px;color:var(--ink-soft)">Đang khởi động camera…</div>
    </div>
    <div class="modal-foot" style="display:flex;flex-direction:column;gap:8px">
      <label class="btn ${touch?"primary":"secondary"}" ${touch?'onclick="qrPhotoMode()"':""} style="width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
        ${touch?"📸 Chụp ảnh mã vạch":"📁 Chọn ảnh chứa mã vạch"}
        <input type="file" accept="image/*" ${touch?'capture="environment"':""} id="qrImgInput" hidden onchange="scanFromImageFile()">
      </label>
      <button class="btn ghost" style="width:100%" onclick="stopQR()">Huỷ</button>
    </div>
  </div>`);

  const stat=document.getElementById("qrStat"),vid=document.getElementById("qrVid");
  const found=val=>{if(alive())qrDone(val);};
  const photoTip=`<br><small>Hoặc bấm ${touch?"📸 Chụp ảnh":"📁 Chọn ảnh"} bên dưới.</small>`;

  if(!navigator.mediaDevices?.getUserMedia){
    stat.innerHTML=`<span style="color:var(--bad)">Không mở được camera trực tiếp.</span>${photoTip}`;
    return;
  }

  const startZXingVideo=()=>{
    loadZXingLib().then(Z=>{
      if(!alive())return;
      if(!Z?.BrowserMultiFormatReader){stat.innerHTML=`<span style="color:var(--bad)">Không tải được bộ đọc mã vạch, kiểm tra mạng.</span>`;return;}
      stat.textContent="Đưa mã vạch vào khung, giữ mã nằm ngang…";
      try{
        qrZXReader=new Z.BrowserMultiFormatReader(zxHints());
        qrZXReader.decodeFromVideoElementContinuously(vid,r=>{if(r)found(r.getText());});
      }catch(e){}
    });
  };

  const startScan=()=>{
    if(!alive())return;
    stat.textContent="Đang tải bộ đọc mã vạch…";
    getBarcodeDetector().then(bd=>{
      if(!alive())return;
      if(!bd){startZXingVideo();return;}
      stat.textContent="Đưa mã vạch vào khung, giữ mã nằm ngang…";
      const loop=()=>{
        if(!alive())return;
        if(vid.readyState>=2&&vid.videoWidth){
          bd.detect(vid).then(c=>{if(!alive())return;if(c.length)found(c[0].rawValue);else qrAF=setTimeout(loop,100);})
            .catch(()=>{if(alive())qrAF=setTimeout(loop,300);});
        }else qrAF=setTimeout(loop,200);
      };
      loop();
    });
  };

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})
    .then(stream=>{
      if(!alive()){stream.getTracks().forEach(t=>t.stop());return;}
      qrStream=stream;
      vid.srcObject=stream;vid.play().catch(()=>{});
      if(vid.readyState>=2)startScan();else vid.addEventListener("loadeddata",startScan,{once:true});
    })
    .catch(err=>{
      if(!alive())return;
      const msg=err.name==="NotAllowedError"?"Chưa cấp quyền camera (bấm 🔒 / aA trên thanh địa chỉ để cho phép).":
        err.name==="NotFoundError"?"Không tìm thấy camera.":
        err.name==="NotReadableError"?"Camera đang được ứng dụng khác dùng.":"Lỗi camera: "+esc(err.message);
      stat.innerHTML=`<span style="color:var(--bad)">${msg}</span>${photoTip}`;
    });
}

function stopQR(doClose=true){
  qrSession++;
  clearTimeout(qrAF);cancelAnimationFrame(qrAF);qrAF=null;
  if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null;}
  if(qrZXReader){try{qrZXReader.reset();}catch(e){}qrZXReader=null;}
  if(!doClose)return;
  _qrOpen=false;
  const m=document.getElementById("modalMount");m.innerHTML="";
  if(_qrPrevModal){m.appendChild(_qrPrevModal);_qrPrevModal=null;}
}

function qrDone(val){const cb=_qrFoundCb;stopQR();if(cb)cb(val);}

// iPhone không cho camera trực tiếp và camera chụp ảnh chạy cùng lúc: tắt luồng trực tiếp trước
function qrPhotoMode(){
  stopQR(false);
  const box=document.getElementById("qrBox");if(box)box.style.display="none";
  const st=document.getElementById("qrStat");if(st)st.textContent="Chụp gần để mã vạch rõ nét, chiếm khoảng nửa khung hình.";
}

function zxHints(){
  const Z=window.ZXing,F=Z.BarcodeFormat,h=new Map();
  h.set(Z.DecodeHintType.TRY_HARDER,true);
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE,F.DATA_MATRIX]);
  return h;
}

function drawScaledRotated(img,max,deg,cv){
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(W,H)),w=W*s,h=H*s;
  const r=deg*Math.PI/180,c=Math.abs(Math.cos(r)),n=Math.abs(Math.sin(r));
  cv.width=Math.ceil(w*c+h*n);cv.height=Math.ceil(w*n+h*c);
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.translate(cv.width/2,cv.height/2);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);
  return cv;
}

// Ảnh chụp tay thường nghiêng: thử xoay 0/22/45/67° (bộ đọc tự lo phần 90°) ở vài độ phân giải
async function decodeImageRobust(img){
  const cv=document.createElement("canvas"),angles=[0,22.5,45,67.5];
  const bd=await getBarcodeDetector();
  if(bd){
    for(const max of [1280,1920,800])for(const deg of angles){
      drawScaledRotated(img,max,deg,cv);
      try{const r=await bd.detect(cv);if(r.length)return r[0].rawValue;}catch(e){}
    }
    return null;
  }
  const Z=await loadZXingLib();if(!Z?.MultiFormatReader)return null;
  const hints=zxHints(),reader=new Z.MultiFormatReader();reader.setHints(hints);
  for(const max of [1280,800,1920])for(const deg of angles){
    drawScaledRotated(img,max,deg,cv);
    try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))),hints).getText();}catch(e){}
    await new Promise(r=>setTimeout(r));
  }
  return null;
}

function scanFromImageFile(){
  const input=document.getElementById("qrImgInput");
  if(!input?.files?.length)return;
  const url=URL.createObjectURL(input.files[0]);
  input.value="";
  qrPhotoMode();
  const sid=qrSession,stat=document.getElementById("qrStat");
  if(stat)stat.textContent="Đang đọc mã vạch từ ảnh…";
  const img=new Image();
  img.onload=async()=>{
    let val=null;try{val=await decodeImageRobust(img);}catch(e){}
    URL.revokeObjectURL(url);
    if(sid!==qrSession||!_qrOpen)return;
    if(val){qrDone(val);return;}
    if(stat)stat.innerHTML=`<span style="color:var(--bad)">Không đọc được mã từ ảnh này.</span><br><small>Chụp gần hơn để mã vạch rõ và chiếm khoảng nửa khung hình.</small><br><small style="opacity:.5">${img.naturalWidth}×${img.naturalHeight} · ${_bdKind||"js"}</small>`;
  };
  img.onerror=()=>{URL.revokeObjectURL(url);if(stat)stat.innerHTML=`<span style="color:var(--bad)">Không mở được ảnh này.</span>`;};
  img.src=url;
}
window.scanFromImageFile=scanFromImageFile;window.qrPhotoMode=qrPhotoMode;

function renderStoreCats(){
  const cats=["Tất cả",...new Set(DB.products.filter(p=>p.stock>0).map(p=>p.category).filter(Boolean)).values()].sort((a,b)=>a==="Tất cả"?-1:b==="Tất cả"?1:a.localeCompare(b,"vi"));

}

function storeSetCat(cat){storeActiveCat=cat==="Tất cả"?"":cat;renderStoreCats();renderStoreGrid();}

function renderStoreGrid(){
  const prods=DB.products.filter(p=>p.stock>0&&(!storeActiveCat||p.category===storeActiveCat));
  const el=document.getElementById("storeGrid");
  if(!prods.length){el.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">✦</div><h3>Không có sản phẩm</h3><p class="muted">Danh mục này đang cập nhật.</p></div>`;return;}
  el.innerHTML=prods.map(p=>`<div class="sp-card">
    ${p.image?`<div class="sp-img"><img src="${p.image}" alt="${esc(p.name)}"></div>`:`<div class="sp-img">✦</div>`}
    <div class="sp-body">
      <div class="sp-name">${esc(p.name)}</div>
      <div class="sp-cat">${esc(p.category||"")}</div>
      <div class="sp-price">${money(p.price)}</div>
    </div>
    <div class="sp-foot">
      ${p.stock>0?`
        <div class="sp-qty">
          <button onclick="changeCartQty('${p.id}',-1)">−</button>
          <span class="sp-qty-val" id="qv_${p.id}">${cart[p.id]||0}</span>
          <button onclick="changeCartQty('${p.id}',1)">＋</button>
        </div>
        <button class="add-btn${cart[p.id]?" added":""}" id="ab_${p.id}" onclick="addToCart('${p.id}')">${cart[p.id]?"✓ Đã thêm":"Thêm vào giỏ"}</button>
      `:`<div class="out-badge">Hết hàng</div>`}
    </div>
  </div>`).join("");
}

function addToCart(id){
  if(!cart[id])cart[id]=1;
  updateCartUI();
}

function changeCartQty(id,delta){
  const p=productById(id);if(!p)return;
  const cur=cart[id]||0;
  const newQty=Math.max(0,Math.min(p.stock,cur+delta));
  if(newQty===0)delete cart[id];else cart[id]=newQty;
  // update this card's display inline
  const qv=document.getElementById("qv_"+id);if(qv)qv.textContent=cart[id]||0;
  const ab=document.getElementById("ab_"+id);if(ab){ab.textContent=cart[id]?"✓ Đã thêm":"Thêm vào giỏ";ab.classList.toggle("added",!!cart[id]);}
  updateCartUI();
}

function cartCount(){return Object.values(cart).reduce((s,q)=>s+q,0);}
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=productById(id);return s+(p?p.price*q:0);},0);}

function updateCartUI(){
  const count=cartCount(),total=cartTotal();
  // badge
  const badge=document.getElementById("cartBadge");
  if(badge){badge.textContent=count;badge.style.display=count>0?"grid":"none";}
  // bar
  const bar=document.getElementById("cartBar");
  if(bar){
    bar.classList.toggle("show",count>0);
    const cnt=document.getElementById("cartBarCount");if(cnt)cnt.textContent=count+" sản phẩm";
    const tot=document.getElementById("cartBarTotal");if(tot)tot.textContent=money(total);
  }
}

function openCart(){
  if(cartCount()===0){toast("Giỏ hàng trống");return;}
  const items=Object.entries(cart).map(([id,qty])=>{const p=productById(id);return p?{p,qty}:null;}).filter(Boolean);
  const total=cartTotal();
  const rows=items.map(({p,qty})=>`<div class="cart-item">
    ${thumbHtml(p,40)}
    <div class="grow"><div class="cart-item-name">${esc(p.name)}</div><div class="cart-item-price">${money(p.price)} × ${qty} = <b>${money(p.price*qty)}</b></div></div>
    <div class="sp-qty" style="border-color:var(--line)">
      <button onclick="changeCartQty('${p.id}',-1);refreshCartModal()">−</button>
      <span class="sp-qty-val">${qty}</span>
      <button onclick="changeCartQty('${p.id}',1);refreshCartModal()">＋</button>
    </div>
  </div>`).join("");
  mountModal(`<div class="modal">
    <div class="modal-head"><h2>🛒 Giỏ hàng (${cartCount()})</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="cartBody">
      ${rows}
      <div class="cart-total-row"><span>Tổng cộng</span><span class="amount">${money(total)}</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Tiếp tục mua</button>
      <button class="btn primary" style="flex:1" onclick="openCheckout()">Đặt hàng →</button>
    </div>
  </div>`);
}

function refreshCartModal(){
  if(cartCount()===0){closeModal();updateCartUI();renderStoreGrid();return;}
  updateCartUI();openCart();
}

function openCheckout(){
  const total=cartTotal();
  mountModal(`<div class="modal">
    <div class="modal-head"><h2>📋 Thông tin đặt hàng</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="calc-note" style="margin-bottom:16px">
        🛒 <b>${cartCount()}</b> sản phẩm · Tổng cộng: <b style="color:var(--rose-deep)">${money(total)}</b>
      </div>
      <div class="field"><label>Họ và tên *</label><input id="coName" placeholder="Nguyễn Văn A" autocomplete="name"></div>
      <div class="field"><label>Số điện thoại *</label><input id="coPhone" type="tel" inputmode="tel" placeholder="0901 234 567" autocomplete="tel"></div>
      <div class="field"><label>Ghi chú cho đơn hàng</label><textarea id="coNote" placeholder="Màu sắc, kích thước, địa chỉ giao..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="openCart()">← Quay lại</button>
      <button class="btn primary" style="flex:1" id="confirmOrder">✓ Xác nhận đặt hàng</button>
    </div>
  </div>`);
  document.getElementById("confirmOrder").onclick=submitOrder;
  document.getElementById("coName").focus();
}

function submitOrder(){
  const name=document.getElementById("coName").value.trim();
  const phone=document.getElementById("coPhone").value.trim();
  const note=document.getElementById("coNote").value.trim();
  if(!name){toast("Vui lòng nhập họ tên");return;}
  if(!phone){toast("Vui lòng nhập số điện thoại");return;}
  // Find or create customer
  let cust=DB.customers.find(c=>c.phone===phone||c.name===name);
  if(!cust){cust={id:uid(),name,phone,address:"",note:""};DB.customers.push(cust);}
  else{if(!cust.phone&&phone)cust.phone=phone;}
  // Create sale transactions
  const today=new Date().toISOString().slice(0,10);
  Object.entries(cart).forEach(([productId,qty])=>{
    const p=productById(productId);if(!p||qty<=0)return;
    const actualQty=Math.min(qty,p.stock);if(actualQty<=0)return;
    DB.transactions.push({id:uid(),type:"sale",date:today,productId,qty:actualQty,unitPrice:p.price,unitCost:p.cost,partyId:cust.id,note:note||"Đơn qua cửa hàng online"});
    p.stock-=actualQty;
  });
  save();
  const total=cartTotal(); // capture before clearing
  cart={};updateCartUI();
  // Success screen
  document.getElementById("modalMount").innerHTML=`<div class="modal-back"><div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:32px 24px">
      <div style="font-size:52px;margin-bottom:14px">🎉</div>
      <h2 style="font-size:22px;margin-bottom:10px;color:var(--good)">Đặt hàng thành công!</h2>
      <p class="muted">Cảm ơn <b>${esc(name)}</b> đã mua hàng.</p>
      <p class="muted">Chúng tôi sẽ liên hệ lại qua số <b>${esc(phone)}</b>.</p>
      <div style="background:var(--surface-2);border-radius:12px;padding:14px;margin:18px 0;font-size:15px">
        Tổng đơn hàng: <b style="font-family:'Fraunces',serif;font-size:20px;color:var(--rose-deep)">${money(total)}</b>
      </div>
      <button class="btn primary" style="width:100%" onclick="document.getElementById('modalMount').innerHTML='';renderStoreGrid()">Tiếp tục mua hàng</button>
    </div>
  </div></div>`;
  renderStoreGrid();
}

window.storeSetCat=storeSetCat;window.addToCart=addToCart;window.changeCartQty=changeCartQty;
window.openCart=openCart;window.refreshCartModal=refreshCartModal;window.openCheckout=openCheckout;

/* ======= QR SCAN & FETCH PRODUCT ======= */
async function scanAndFetchProduct(){
  openQRScanner(async code=>{
    // Check if it's an existing internal product
    const existing=DB.products.find(p=>p.id===code||(p.sku&&p.sku===code));
    if(existing){toast("Tìm thấy sản phẩm trong kho!");openProductModal(existing.id);return;}
    // Show loading
    mountModal(`<div class="modal" style="max-width:360px;text-align:center">
      <div class="modal-body" style="padding:32px 24px">
        <div style="font-size:36px;margin-bottom:12px">🔍</div>
        <div style="font-weight:700;margin-bottom:6px">Đang tìm thông tin sản phẩm...</div>
        <div style="font-size:13px;color:var(--ink-soft)">Mã: ${esc(code)}</div>
      </div>
    </div>`);
    try{
      const resp=await fetch(`https://world.openbeautyfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
      const data=await resp.json();
      if(data.status===1&&data.product){
        const prod=data.product;
        const name=prod.product_name_vi||prod.product_name||prod.product_name_en||"";
        const brands=prod.brands||"";
        const ingredients=prod.ingredients_text_vi||prod.ingredients_text||"";
        const quantity=prod.quantity||"";
        const imageUrl=prod.image_front_url||prod.image_url||"";
        const noteLines=[brands&&`Thương hiệu: ${brands}`,quantity&&`Quy cách: ${quantity}`,ingredients&&`Thành phần: ${ingredients}`].filter(Boolean);
        closeModal();
        toast("Đã lấy được thông tin sản phẩm!");
        openProductModal(null,{name,sku:code,note:noteLines.join("\n"),imageUrl,source:"Open Beauty Facts"});
      }else{
        // Try Open Food Facts as fallback
        try{
          const r2=await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
          const d2=await r2.json();
          if(d2.status===1&&d2.product){
            const prod=d2.product;
            const name=prod.product_name_vi||prod.product_name||"";
            const brands=prod.brands||"";
            const imageUrl=prod.image_front_url||prod.image_url||"";
            closeModal();
            toast("Đã lấy thông tin từ cơ sở dữ liệu!");
            openProductModal(null,{name,sku:code,note:brands?`Thương hiệu: ${brands}`:"",imageUrl,source:"Open Food Facts"});
          }else{
            closeModal();
            toast("Không tìm thấy — nhập thủ công");
            openProductModal(null,{sku:code});
          }
        }catch(e2){closeModal();toast("Không có mạng — nhập thủ công");openProductModal(null,{sku:code});}
      }
    }catch(e){closeModal();toast("Không có mạng — nhập thủ công");openProductModal(null,{sku:code});}
  });
}

  if(!isMob())topBtn("＋ Thêm danh mục","primary",()=>openCategoryModal());
  if(!DB.categories)DB.categories=[];
  const cats=DB.categories;
  const c=document.getElementById("content");
  if(!cats.length){
    c.innerHTML=emptyState("🏷","Chưa có danh mục","Thêm danh mục để phân loại sản phẩm.","＋ Thêm danh mục",()=>openCategoryModal());
    return;
  }
  c.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:4px 0">
    ${cats.map(cat=>{
      const count=DB.products.filter(p=>p.category===cat.name).length;
      return`<div class="m-card" style="padding:16px 14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <span style="font-size:26px">${esc(cat.icon||"🏷")}</span>
          <div style="display:flex;gap:4px">
            <button class="icon-btn" onclick="openCategoryModal('${cat.id}')">✎</button>
            <button class="icon-btn" onclick="delCategory('${cat.id}')">🗑</button>
          </div>
        </div>
        <div style="font-weight:700;font-size:15px;margin-bottom:4px">${esc(cat.name)}</div>
        <div style="font-size:13px;color:var(--ink-soft)">${count} sản phẩm</div>
      </div>`;
    }).join("")}
  </div>`;
}
function openCategoryModal(id){
  if(!DB.categories)DB.categories=[];
  const cat=id?DB.categories.find(c=>c.id===id):null;
  const icons=["🏷","💄","🧴","✨","🌸","💅","🛁","🧼","🌿","🪥","💊","🌺","💋","🫧","🧹","🪞","👄","🧡","💆","🌟"];
  const curIcon=cat?cat.icon||"🏷":"🏷";
  mountModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><h2>${cat?"Sửa danh mục":"Thêm danh mục"}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Tên danh mục *</label><input id="cName" value="${cat?esc(cat.name):""}" placeholder="VD: Son môi, Kem dưỡng..."></div>
      <div class="field"><label>Biểu tượng</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
          ${icons.map(ic=>`<button type="button" onclick="pickCatIcon(this,'${ic}')" style="width:42px;height:42px;border-radius:8px;border:2px solid ${ic===curIcon?"var(--plum)":"var(--line)"};background:${ic===curIcon?"var(--plum-soft,#f3e8ff)":"var(--surface-2)"};cursor:pointer;font-size:20px;transition:.15s">${ic}</button>`).join("")}
        </div>
        <input type="hidden" id="cIcon" value="${esc(curIcon)}">
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Huỷ</button><button class="btn primary" onclick="saveCategory('${id||""}')">Lưu danh mục</button></div>
  </div>`);
}
function pickCatIcon(btn,icon){
  document.getElementById("cIcon").value=icon;
  document.querySelectorAll("#modalWrap button[onclick^='pickCatIcon']").forEach(b=>{
    b.style.border="2px solid var(--line)";b.style.background="var(--surface-2)";
  });
  btn.style.border="2px solid var(--plum)";btn.style.background="var(--plum-soft,#f3e8ff)";
}
function saveCategory(id){
  if(!DB.categories)DB.categories=[];
  const name=document.getElementById("cName").value.trim();
  if(!name){toast("Vui lòng nhập tên danh mục");return;}
  const icon=document.getElementById("cIcon").value||"🏷";
  if(id){
    const cat=DB.categories.find(c=>c.id===id);
    if(cat){
      const oldName=cat.name;
      cat.name=name;cat.icon=icon;
      if(oldName!==name)DB.products.forEach(p=>{if(p.category===oldName)p.category=name;});
    }
  }else{
    if(DB.categories.some(c=>c.name===name)){toast("Danh mục này đã tồn tại");return;}
    DB.categories.push({id:uid(),name,icon});
  }
  save();closeModal();toast(id?"Đã cập nhật danh mục":"Đã thêm danh mục");go("categories");
}
function delCategory(id){
  if(!DB.categories)return;
  const cat=DB.categories.find(c=>c.id===id);if(!cat)return;
  const count=DB.products.filter(p=>p.category===cat.name).length;
  confirmModal("Xoá danh mục?",`Xoá danh mục <b>${esc(cat.name)}</b>?${count?`<br><span class='muted'>${count} sản phẩm sẽ không còn thuộc danh mục này.</span>`:""}`,()=>{
    DB.categories=DB.categories.filter(c=>c.id!==id);
    save();toast("Đã xoá danh mục");go("categories");
  });
}

/* ======= ORDER NOTIFICATION SYSTEM ======= */
const NOTIFY_KEY='myphamHH_notify';
const SEEN_KEY='myphamHH_lastSeen';
let unreadCount=0;

function money2(n){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n||0);}

function updateBadge(){
  const el=document.getElementById("navBadge");
  if(!el)return;
  if(unreadCount>0){el.textContent=unreadCount>99?"99+":unreadCount;el.style.display="inline-block";}
  else el.style.display="none";
}

function showOrderAlert(order){
  document.querySelectorAll(".order-alert").forEach(e=>e.remove());
  const div=document.createElement("div");
  div.className="order-alert";
  div.innerHTML=`<div class="order-alert-ico">🛒</div>
    <div class="order-alert-body">
      <div class="order-alert-title">Đơn hàng mới! ${order.name||""} – ${order.phone||""}</div>
      <div class="order-alert-sub">Tổng tiền: ${money2(order.total)} · Nhấn để xem giao dịch</div>
    </div>
    <button class="order-alert-close" onclick="this.parentElement.remove()">✕</button>`;
  div.addEventListener("click",e=>{
    if(e.target.classList.contains("order-alert-close"))return;
    div.remove();go("transactions");
  });
  document.body.appendChild(div);
  setTimeout(()=>{if(div.parentNode)div.remove();},12000);
}

function checkUnreadOnLoad(){
  try{
    const lastSeen=parseInt(localStorage.getItem(SEEN_KEY)||"0");
    const db=loadDB();if(!db)return;
    const newSales=(db.transactions||[]).filter(t=>t.type==="sale"&&t.note&&t.note.includes("[Online]")&&new Date(t.date).getTime()>(lastSeen-86400000));
    unreadCount=newSales.length;
    updateBadge();
  }catch(e){}
}

window.addEventListener("storage",e=>{
  if(e.key!==NOTIFY_KEY||!e.newValue)return;
  try{
    const order=JSON.parse(e.newValue);
    if(order.type!=="new_order")return;
    unreadCount++;
    updateBadge();
    showOrderAlert(order);
    if(current==="transactions")renderTransactions();
    if(current==="dashboard")go("dashboard");
  }catch(err){}
});

checkUnreadOnLoad();
