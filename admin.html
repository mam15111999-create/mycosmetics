<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a2545">
<title>Mỹ Phẩm Hoàng Hiền – Quản lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* =========== TOKENS =========== */
:root{
  --plum:#4a2545;--plum-soft:#6b3a5e;--rose:#c64f7b;--rose-deep:#a83a63;
  --gold:#c99a4e;--bg:#fbf3f6;--surface:#fffbfc;--surface-2:#f7ebf0;
  --line:#ecd7e0;--ink:#3a2333;--ink-soft:#7d6472;
  --good:#2f9e6b;--good-bg:#e4f4ec;--warn:#c9791f;--warn-bg:#fbeed9;
  --bad:#c53b3b;--bad-bg:#f8e2e2;
  --shadow:0 6px 22px rgba(74,37,69,.11);--shadow-sm:0 2px 8px rgba(74,37,69,.08);
  --radius:16px;--bnav-h:64px;
  color-scheme:light;
}
:root:not([data-theme="light"]){
  @media(prefers-color-scheme:dark){
    --plum:#e9c7dc;--plum-soft:#caa0bb;--rose:#e987ac;--rose-deep:#f0a0bf;--gold:#dcb673;
    --bg:#1c1119;--surface:#271823;--surface-2:#32202c;--line:#432d3b;
    --ink:#f3e6ee;--ink-soft:#b494a8;
    --good:#5bc793;--good-bg:#1e3a2c;--warn:#e0a24a;--warn-bg:#3d2e17;--bad:#ec6d6d;--bad-bg:#3d1e1e;
    --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plum:#e9c7dc;--plum-soft:#caa0bb;--rose:#e987ac;--rose-deep:#f0a0bf;--gold:#dcb673;
  --bg:#1c1119;--surface:#271823;--surface-2:#32202c;--line:#432d3b;
  --ink:#f3e6ee;--ink-soft:#b494a8;
  --good:#5bc793;--good-bg:#1e3a2c;--warn:#e0a24a;--warn-bg:#3d2e17;--bad:#ec6d6d;--bad-bg:#3d1e1e;
  --shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.28);color-scheme:dark;
}
/* =========== RESET =========== */
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces","Instrument Sans",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;color:var(--plum)}
button,input,select,textarea{font-family:inherit;font-size:16px}
img{max-width:100%}
.tnum{font-variant-numeric:tabular-nums}
/* =========== LOGIN =========== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px 28px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:18px}
.login-card h1{text-align:center;font-size:24px;margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:28px}
.login-err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
/* =========== LAYOUT =========== */
.app{display:flex;min-height:100%;padding-bottom:0}
.sidebar{
  width:236px;flex-shrink:0;background:var(--plum);color:#fbeef4;
  display:flex;flex-direction:column;gap:5px;
  padding:calc(env(safe-area-inset-top,0px)+22px) 14px 22px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand-mark{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--gold));display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:600;font-size:21px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand-name{font-family:"Fraunces",serif;font-weight:600;font-size:17px;line-height:1.15;color:#fff}
.brand-sub{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#e6b9d0;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#f0d5e4;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .15s,color .15s;min-height:44px}
.nav-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-btn.active{background:var(--surface);color:var(--plum);font-weight:600;box-shadow:var(--shadow-sm)}
.nav-btn .ic{width:20px;text-align:center;font-size:16px}
.nav-spacer{flex:1}
.nav-foot{font-size:11px;color:#d09cba;padding:0 10px;line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,28px);
  display:flex;align-items:center;gap:12px;
}
.topbar h1{font-size:21px}
.topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:clamp(14px,3vw,28px);max-width:1180px;width:100%}
/* =========== BUTTONS =========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;min-height:44px}
.btn:hover{border-color:var(--rose);color:var(--rose-deep)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:var(--rose-deep);border-color:var(--rose-deep)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;min-height:36px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:7px;min-height:30px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);transition:.15s;flex-shrink:0}
.icon-btn:hover{border-color:var(--rose);color:var(--rose-deep)}
.menu-toggle{display:none}
/* =========== STAT CARDS =========== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow-sm)}
.stat .label{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:"Fraunces",serif;font-size:26px;font-weight:600;color:var(--plum);margin-top:8px;line-height:1.1}
.stat .foot{font-size:12px;color:var(--ink-soft);margin-top:5px}
.stat .val.rose{color:var(--rose-deep)}.stat .val.good{color:var(--good)}
/* =========== PANELS =========== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px}.panel-head .btn{margin-left:auto}
.panel-body{padding:8px 18px 16px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
/* =========== TOOLBAR =========== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
select.filter{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
/* =========== TABLE =========== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.prod-cell{display:flex;align-items:center;gap:10px}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface-2);border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;font-size:16px;color:var(--rose)}
.prod-name{font-weight:600;color:var(--ink)}.prod-sku{font-size:12px;color:var(--ink-soft)}
.row-actions{display:flex;gap:5px;justify-content:flex-end}
/* =========== MOBILE CARDS =========== */
.card-list{display:flex;flex-direction:column;gap:11px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.m-card-head{display:flex;align-items:center;gap:11px;padding:14px 14px 10px}
.m-card-head .grow{flex:1;min-width:0}
.m-card-body{padding:0 14px 4px;display:flex;flex-direction:column;gap:0}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.m-row span{color:var(--ink-soft);font-size:13px}
.m-row b,.m-row strong{text-align:right;font-variant-numeric:tabular-nums}
.m-card-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.m-card-foot .btn{flex:1;min-width:0}
/* Txn card */
.txn-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.txn-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.txn-card-top .grow{flex:1;min-width:0}
.txn-card-meta{font-size:13px;color:var(--ink-soft)}
.txn-card-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.txn-card-nums>div{display:flex;flex-direction:column;gap:2px}
.txn-card-nums .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
/* Partner card */
.party-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow-sm)}
.party-card-name{font-weight:700;font-size:16px;margin-bottom:5px}
.party-card-info{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-soft)}
.party-card-info span{display:flex;align-items:center;gap:7px}
.party-card-foot{display:flex;gap:8px;margin-top:12px}
/* =========== PILLS =========== */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.rose{background:var(--surface-2);color:var(--rose-deep)}
.pill.sale{background:var(--good-bg);color:var(--good)}
.pill.purchase{background:#e7eefb;color:#3763b8}
:root[data-theme="dark"] .pill.purchase,:root:not([data-theme="light"]) .pill.purchase{background:#1e2c47;color:#84a9e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.purchase{background:#1e2c47;color:#84a9e8}}
.cat-tag{font-size:12px;color:var(--ink-soft)}
/* =========== EMPTY STATE =========== */
.empty{text-align:center;padding:42px 20px;color:var(--ink-soft)}
.empty .big{font-size:36px;margin-bottom:10px}
.empty h3{color:var(--plum);margin-bottom:6px}
/* =========== CHARTS =========== */
.chart-bars{display:flex;align-items:flex-end;gap:9px;height:170px;padding:8px 2px 0}
.cbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.cbar-track{width:100%;flex:1;display:flex;align-items:flex-end}
.cbar{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--rose),var(--rose-deep));min-height:3px;transition:height .4s}
.cbar-lbl{font-size:11.5px;color:var(--ink-soft)}
.cbar-val{font-size:10.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.top-list{display:flex;flex-direction:column;gap:0}
.top-row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.top-row:last-child{border-bottom:0}
.top-rank{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--rose-deep);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.top-row .grow{flex:1;min-width:0}
.top-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-meta{font-size:12px;color:var(--ink-soft)}
.bar-mini{height:6px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.bar-mini>span{display:block;height:100%;background:var(--rose);border-radius:4px}
/* =========== TOAST =========== */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* =========== ORDER NOTIFICATION =========== */
.order-alert{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#1a7f37,#2da44e);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);animation:slideDown .35s ease;cursor:pointer}
.order-alert:hover{background:linear-gradient(135deg,#166429,#268f43)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.order-alert-ico{font-size:26px;flex-shrink:0}
.order-alert-body{flex:1;min-width:0}
.order-alert-title{font-weight:700;font-size:15px}
.order-alert-sub{font-size:12.5px;opacity:.9;margin-top:2px}
.order-alert-close{font-size:20px;padding:4px 8px;opacity:.8;flex-shrink:0}
.sync-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.sync-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex-shrink:0}
.sync-dot.busy::before{background:var(--warn)}.sync-dot.err::before{background:var(--bad)}
@media(max-width:720px){.sync-dot>span{display:none}}
.menu-toggle{position:relative}
.menu-dot{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#e53935;border:2px solid var(--bg)}
.notif-badge{background:#e53935;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:6px;vertical-align:middle;display:inline-block;min-width:16px;text-align:center}
/* =========== FORMS =========== */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--ink-soft);font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--rose)}
.field textarea{resize:vertical;min-height:64px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.scan-row{width:100%;justify-content:center;padding:13px;font-size:15px;font-weight:700;margin-bottom:12px;border:1.5px dashed var(--rose);color:var(--rose-deep);background:var(--surface-2)}
.scan-info{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:14px;background:var(--surface-2);font-size:13.5px}
.scan-info.ok{border-color:var(--good);background:var(--good-bg)}
.scan-info.warn{border-color:var(--warn);background:var(--warn-bg)}
.scan-code{font-size:12.5px;color:var(--ink-soft);margin-bottom:7px;word-break:break-all}
.scan-code b{color:var(--ink);font-size:14.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.scan-prod{display:flex;align-items:center;gap:10px}
.scan-prod .grow{flex:1;min-width:0}
.scan-name{font-weight:700;color:var(--ink)}
.scan-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.scan-miss{font-weight:700;color:var(--warn)}
.scan-note{margin-top:8px;font-size:12.5px;color:var(--ink)}
.scan-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.scan-actions .btn{width:100%;justify-content:center}
.form-sec{font-weight:700;font-size:14px;color:var(--plum);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.form-sec .hint{font-weight:400;color:var(--ink-soft);font-size:12px}
.calc-note{background:var(--surface-2);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--ink-soft);margin-top:2px}
.img-pick{display:flex;align-items:center;gap:12px}
.img-preview{width:56px;height:56px;border-radius:11px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--rose);font-size:20px;flex-shrink:0}
/* =========== MODAL =========== */
.modal-back{position:fixed;inset:0;background:rgba(58,35,51,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-head{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h2{font-size:18px}.modal-head .icon-btn{margin-left:auto}
.modal-backbtn{display:none;place-items:center;width:40px;height:40px;border:0;background:transparent;color:var(--plum);font-size:24px;line-height:1;cursor:pointer;border-radius:10px;flex-shrink:0;margin-left:-4px}
.modal-backbtn:active{background:var(--surface-2)}
.modal-back,.modal-body{overscroll-behavior:contain}
@media(max-width:720px){body.modal-open{overflow:hidden;overscroll-behavior:none}}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.grid-2>*{min-width:0}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
/* =========== MISC =========== */
.backup-area{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--ink-soft)}
.danger-zone{border:1px solid var(--bad);border-radius:12px;padding:13px 15px;margin-top:10px}
.danger-zone h3{color:var(--bad);font-size:15px;margin-bottom:5px}
.seg-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
.seg-tab{flex:1;padding:10px 8px;border:0;background:var(--surface);color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.seg-tab.active{background:var(--plum);color:#fff}
/* =========== BILL / POS =========== */
.disc-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.disc-toggle button{border:0;background:var(--surface);color:var(--ink-soft);padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.disc-toggle button.active{background:var(--plum);color:#fff}

<script>
"use strict";
/* ======= AUTH ======= */
const CB=window.cloudBackend;

const AUTH_KEY="myphamHH_auth";
const DB_KEY="myphamHH_v1";
const THEME_KEY="myphamHH_theme";
const DEFAULT_AUTH={username:"admin",password:"admin"};

function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY+"_cred"))||DEFAULT_AUTH;}catch(e){return DEFAULT_AUTH;}}
function isLoggedIn(){try{return sessionStorage.getItem(AUTH_KEY)==="1";}catch(e){return false;}}
function doLogin(user,pass){
  const cred=getAuth();
  return user.trim()===cred.username&&pass===cred.password;
}
function logout(){try{sessionStorage.removeItem(AUTH_KEY);}catch(e){}showLogin();}

function showLogin(){
  document.getElementById("loginWrap").hidden=false;

}
function showApp(){

/* login form */
document.getElementById("lBtn").onclick=function(){
  const u=document.getElementById("lUser").value;
  const p=document.getElementById("lPass").value;

      .finally(()=>{btn.disabled=false;btn.textContent="Đăng nhập →";});
    return;
  }
  if(doLogin(u,p)){

    showApp();seed();startRoute();
  } else {

});

/* ======= DATA ======= */
const DEFAULT={products:[],suppliers:[],customers:[],transactions:[],bills:[],categories:[],orders:[],seeded:false};

function loadDB(){try{const r=localStorage.getItem(DB_KEY);if(r)return Object.assign({},DEFAULT,JSON.parse(r));}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){if(CLOUD){cloudSave();return;}try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){toast("Không lưu được dữ liệu");}}

/* ======= UTILS ======= */
const fmt=n=>(Math.round(n||0)).toLocaleString("vi-VN");
const money=n=>fmt(n)+"₫";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
const isMob=()=>window.innerWidth<=720;
const supplierName=id=>(byId(DB.suppliers,id)||{}).name||"—";
const customerName=id=>(byId(DB.customers,id)||{}).name||"—";
const productById=id=>byId(DB.products,id);
// Cùng một mã UPC-A có thể được đọc thành 12 số hoặc 13 số có số 0 đầu tuỳ máy
const normCode=s=>{s=String(s||"").replace(/\s+/g,"").toUpperCase();return /^0\d{12}$/.test(s)?s.slice(1):s;};
function productCodes(p){
  const codes=[];
  if(p.sku)codes.push(p.sku);
  if(Array.isArray(p.barcodes))for(const b of p.barcodes)codes.push(b);
  return codes;
}
function findProductByCode(code,exceptId){
  const c=normCode(code);if(!c)return null;
  return DB.products.find(p=>p.id!==exceptId&&(p.id===code||productCodes(p).some(b=>normCode(b)===c)))||null;
}
function addBarcodeToProduct(p,code){
  const c=normCode(code);if(!c)return false;
  if(!Array.isArray(p.barcodes))p.barcodes=[];
  if(p.sku&&normCode(p.sku)===c)return false;
  if(p.barcodes.some(b=>normCode(b)===c))return false;
  p.barcodes.push(code);return true;
}
function rmProductCode(productId,code){
  const p=productById(productId);if(!p)return;
  const c=normCode(code);
  if(p.sku&&normCode(p.sku)===c)p.sku="";
  if(Array.isArray(p.barcodes))p.barcodes=p.barcodes.filter(b=>normCode(b)!==c);
  save();openProductModal(productId);
}
window.rmProductCode=rmProductCode;
function stockStatus(p){if(p.stock<=0)return{cls:"bad",txt:"Tạm hết hàng"};if(p.stock<=p.lowStock)return{cls:"warn",txt:"Sắp hết"};return{cls:"good",txt:"Còn hàng"};}
function margin(p){if(!p.price)return 0;return(p.price-p.cost)/p.price*100;}
function thumbHtml(p,sz=40){if(p.image)return`<img class="thumb" src="${esc(p.image)}" alt="" style="width:${sz}px;height:${sz}px">`;return`<div class="thumb ph" style="width:${sz}px;height:${sz}px">✦</div>`;}
function fmtDate(d){const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;}

let toastTm;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTm);toastTm=setTimeout(()=>t.classList.remove("show"),2700);}

/* ======= ROUTER ======= */
const VIEWS={
  dashboard:{title:"Tổng quan",sub:"Bức tranh tổng thể cửa hàng",render:renderDashboard},
  orders:{title:"Đơn online",sub:"Đơn khách đặt trên trang web",render:renderOrders},
  products:{title:"Mặt hàng & tồn kho",sub:"Sản phẩm, giá nhập/bán, tồn kho",render:renderProducts},
  salesPos:{title:"Bán hàng",sub:"Lập hóa đơn, tính tiền, giảm giá",render:renderSalesPos},
  purchases:{title:"Nhập hàng",sub:"Nhập kho từ nhà cung cấp",render:renderPurchases},
  transactions:{title:"Lịch sử giao dịch",sub:"Toàn bộ nhập & bán hàng",render:renderTransactions},
  suppliers:{title:"Nhà cung cấp",sub:"Nguồn nhập hàng",render:()=>renderPartyList("supplier",DB.suppliers,"nhà cung cấp","☍")},
  customers:{title:"Khách hàng",sub:"Thông tin khách mua hàng",render:()=>renderPartyList("customer",DB.customers,"khách hàng","☺")},
  partners:{title:"Đối tác",sub:"Nhà cung cấp & khách hàng",render:renderPartners},
  categories:{title:"Danh mục hàng",sub:"Phân loại sản phẩm theo nhóm",render:renderCategories},
  settings:{title:"Cài đặt",sub:"Tài khoản, sao lưu, giao diện",render:renderSettings},
};
let current="dashboard", partnerTab="supplier";
let _histDepth=0,_ignorePop=0,_routeReady=false,_navBusy=false,_syncTimer=0,_pendingView=null;
const viewFromHash=()=>{const v=(location.hash.match(/^#\/(\w+)/)||[])[1];return v&&VIEWS[v]?v:"";};
// Mở app: vào đúng màn hình theo địa chỉ (#/products…), từ đó mỗi lần chuyển màn là một bước lịch sử
function startRoute(){
  _routeReady=false;go(viewFromHash()||"dashboard");
  history.replaceState({view:current},"","#/"+current);_routeReady=true;
}

function go(view,opts={}){
  const prev=current;
  current=view;
  if(_routeReady&&!opts.fromPop&&view!==prev){
    if(_navBusy||_syncTimer||_histDepth>0){_pendingView=view;if(!_syncTimer)_syncTimer=setTimeout(reconcileHistory,0);}
    else history.pushState({view},"","#/"+view);
  }
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  document.querySelectorAll(".bnav-btn").forEach(b=>{
    const v=b.dataset.view;
    b.classList.toggle("active",v===view||(view==="suppliers"&&v==="partners")||(view==="customers"&&v==="partners"));
  });
  const v=VIEWS[view]||VIEWS.dashboard;
  document.getElementById("viewTitle").textContent=v.title;
  document.getElementById("viewSub").textContent=v.sub||"";
  document.getElementById("topActions").innerHTML="";
  document.getElementById("content").innerHTML="";
  updateFAB(view);
  v.render();
  window.scrollTo(0,0);
  closeScrim();
  if(view==="transactions"){
    if(typeof unreadCount!=="undefined"){unreadCount=0;if(typeof updateBadge==="function")updateBadge();}
    try{localStorage.setItem("myphamHH_lastSeen",Date.now());}catch(e){}
  }
}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));
document.getElementById("addProdNavBtn")?.addEventListener("click",()=>{
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("addProdNavBtn").classList.add("active");
  go("products");
  setTimeout(()=>openProductModal(),50);
});

function topBtn(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.innerHTML=label;b.onclick=fn;document.getElementById("topActions").appendChild(b);return b;}

/* FAB behaviour */
function updateFAB(view){
  const fab=document.getElementById("fab");
  if(view==="dashboard"||view==="salesPos"){fab.textContent="＋";fab.title="Lập hóa đơn";fab.onclick=()=>openBillModal();}
  else if(view==="purchases"||view==="transactions"){fab.textContent="＋";fab.title="Nhập hàng";fab.onclick=()=>openTxnModal("purchase");}
  else if(view==="products"){fab.textContent="＋";fab.title="Thêm mặt hàng";fab.onclick=()=>openProductModal();}
  else if(view==="categories"){fab.textContent="＋";fab.title="Thêm danh mục";fab.onclick=()=>openCategoryModal();}
  else if(view==="suppliers"){fab.textContent="＋";fab.title="Thêm nhà cung cấp";fab.onclick=()=>openPartyModal("supplier");}
  else if(view==="customers"){fab.textContent="＋";fab.title="Thêm khách hàng";fab.onclick=()=>openPartyModal("customer");}
  else if(view==="partners"){fab.textContent="＋";fab.title="Thêm đối tác";fab.onclick=()=>openPartyModal(partnerTab==="customer"?"customer":"supplier");}
  else{fab.onclick=null;}
  fab.hidden=!fab.onclick;
}

/* hamburger */
document.getElementById("menuToggle").onclick=()=>{
  document.querySelector(".sidebar").classList.toggle("open");

};

/* sidebar CSS for open state */
document.head.insertAdjacentHTML("beforeend","<style>.sidebar.open{display:flex!important;position:fixed;left:0;top:0;height:100%;z-index:50;width:236px}</style>");

/* ======= DASHBOARD ======= */
function computeStats(){
  const prods=DB.products;
  const inv=prods.reduce((s,p)=>s+p.cost*p.stock,0);
  const retail=prods.reduce((s,p)=>s+p.price*p.stock,0);
  const lowCount=prods.filter(p=>p.stock>0&&p.stock<=p.lowStock).length;
  const outCount=prods.filter(p=>p.stock<=0).length;
  const sales=DB.transactions.filter(t=>t.type==="sale");
  const bills=DB.bills||[];
  const revenue=sales.reduce((s,t)=>s+t.qty*t.unitPrice,0)+bills.reduce((s,b)=>s+b.total,0);
  const profit=sales.reduce((s,t)=>s+t.qty*(t.unitPrice-t.unitCost),0)+bills.reduce((s,b)=>s+b.profit,0);
  const unitsSold=sales.reduce((s,t)=>s+t.qty,0)+bills.reduce((s,b)=>s+b.items.reduce((ss,i)=>ss+i.qty,0),0);
  return{inv,retail,lowCount,outCount,revenue,profit,unitsSold};
}
function renderDashboard(){
  if(!isMob()){topBtn("＋ Lập hóa đơn","primary",()=>openBillModal());topBtn("＋ Nhập hàng","ghost",()=>openTxnModal("purchase"));}
  const s=computeStats();const c=document.getElementById("content");
  const days=backupDaysAgo();
  const backupBanner=(days===-1||days>=BACKUP_DAYS)&&(DB.bills||[]).length?`<div class="backup-banner"><div><b>💾 Nên sao lưu dữ liệu${days===-1?"":` — ${days} ngày chưa sao lưu`}</b><div class="muted" style="font-size:12.5px;margin-top:2px">Tải file sao lưu định kỳ để giữ an toàn ngay cả khi mạng/máy chủ sự cố.</div></div><button class="btn primary" onclick="doExportBackup()">⬇ Sao lưu ngay</button></div>`:"";
  c.innerHTML=`${backupBanner}
    <div class="stat-grid">
      <div class="stat"><div class="label">💰 Doanh thu</div><div class="val rose">${money(s.revenue)}</div><div class="foot">${fmt(s.unitsSold)} sản phẩm đã bán</div></div>
      <div class="stat"><div class="label">📦 Giá trị kho</div><div class="val">${money(s.retail)}</div><div class="foot">Tính theo giá bán</div></div>
      <div class="stat"><div class="label">⚠️ Cần nhập thêm</div><div class="val">${s.lowCount+s.outCount}</div><div class="foot">${s.outCount} hết · ${s.lowCount} sắp hết</div></div>
    </div>
    <div class="two-col">
      <div class="panel"><div class="panel-head"><h2>Doanh thu 6 tháng</h2></div><div class="panel-body" id="revChart"></div></div>
      <div class="panel"><div class="panel-head"><h2>Bán chạy nhất</h2></div><div class="panel-body" id="topProd"></div></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Cần nhập thêm hàng</h2><button class="btn sm" onclick="go('products')">Xem tất cả</button></div><div class="panel-body" id="lowStockList"></div></div>`;
  renderRevChart(document.getElementById("revChart"));
  renderTopProducts(document.getElementById("topProd"));
  renderLowStock(document.getElementById("lowStockList"));
}
function renderRevChart(el){
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.toISOString().slice(0,7),lbl:"T"+(d.getMonth()+1)});}
  const map={};months.forEach(m=>map[m.key]=0);
  DB.transactions.filter(t=>t.type==="sale").forEach(t=>{const k=t.date.slice(0,7);if(k in map)map[k]+=t.qty*t.unitPrice;});
  const max=Math.max(1,...months.map(m=>map[m.key]));
  if(!DB.transactions.filter(t=>t.type==="sale").length){el.innerHTML=`<div class="empty"><div class="big">📊</div>Chưa có dữ liệu bán hàng</div>`;return;}
  el.innerHTML=`<div class="chart-bars">${months.map(m=>{const v=map[m.key];const h=Math.max(3,v/max*100);return`<div class="cbar-wrap"><div class="cbar-val">${v?fmt(v/1000)+"k":""}</div><div class="cbar-track"><div class="cbar" style="height:${h}%"></div></div><div class="cbar-lbl">${m.lbl}</div></div>`;}).join("")}</div>`;
}
function renderTopProducts(el){
  const agg={};DB.transactions.filter(t=>t.type==="sale").forEach(t=>{if(!agg[t.productId])agg[t.productId]={qty:0,rev:0};agg[t.productId].qty+=t.qty;agg[t.productId].rev+=t.qty*t.unitPrice;});
  const rows=Object.entries(agg).map(([id,v])=>({p:productById(id),...v})).filter(r=>r.p).sort((a,b)=>b.rev-a.rev).slice(0,5);
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">🏆</div>Chưa có dữ liệu</div>`;return;}
  const max=rows[0].rev;
  el.innerHTML=`<div class="top-list">${rows.map((r,i)=>`<div class="top-row"><div class="top-rank">${i+1}</div><div class="grow"><div class="top-name">${esc(r.p.name)}</div><div class="top-meta">${fmt(r.qty)} đã bán · ${money(r.rev)}</div><div class="bar-mini"><span style="width:${r.rev/max*100}%"></span></div></div></div>`).join("")}</div>`;
}

function delProduct(id){
  const p=productById(id);if(!p)return;
  const hasTxn=DB.transactions.some(t=>t.productId===id);
  confirmModal("Xoá mặt hàng?",`Bạn có chắc muốn xoá <b>${esc(p.name)}</b>?${hasTxn?"<br><span class='muted'>Giao dịch cũ vẫn được giữ lại.</span>":""}`,()=>{DB.products=DB.products.filter(x=>x.id!==id);save();toast("Đã xoá mặt hàng");go(current);});
}

      }).join("")}</div>`;
      return;
    }
    wrap.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Sản phẩm</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th><th>Đối tác</th><th></th></tr></thead><tbody>${list.map(t=>{const p=productById(t.productId);const total=t.qty*t.unitPrice;return`<tr><td>${fmtDate(t.date)}</td><td><span class="pill ${t.type}">${t.type==="sale"?"Bán":"Nhập"}</span></td><td><div class="prod-name">${esc(p?p.name:"(đã xoá)")}</div>${t.note?`<div class="prod-sku">${esc(t.note)}</div>`:""}</td><td class="num">${fmt(t.qty)}</td><td class="num">${t.type==="sale"?money(t.unitPrice):"—"}</td><td class="num"><b>${t.type==="sale"?money(total):"—"}</b></td><td>${t.type==="sale"?esc(customerName(t.partyId)):esc(supplierName(t.partyId))}</td><td class="row-actions"><button class="icon-btn" onclick="delTxn('${t.id}')">🗑</button></td></tr>`;}).join("")}</tbody></table></div>`;
  };
  draw();
  document.getElementById("txnF").addEventListener("change",e=>{txnFilter=e.target.value;draw();});
}
function delTxn(id){
  const t=byId(DB.transactions,id);if(!t)return;
  confirmModal("Xoá giao dịch?","Xoá giao dịch này sẽ hoàn lại tồn kho. Tiếp tục?",()=>{
    const p=productById(t.productId);
    if(p){if(t.type==="sale")p.stock+=t.qty;else{p.stock-=t.qty;if(p.stock<0)p.stock=0;}}
    DB.transactions=DB.transactions.filter(x=>x.id!==id);save();toast("Đã xoá giao dịch");go(current);
  });
}

let billCart=[], billDiscType="percent", billPayMethod="cash", billPaid=true;
const PAY_LABEL={cash:"💵 Tiền mặt",transfer:"🏦 Chuyển khoản"};
// Hoá đơn cũ (trước khi có phần thanh toán) coi như đã thanh toán
const billIsPaid=b=>b.paid!==false;
function billPayPills(b){
  if(!b._isBill&&b._isBill!==undefined)return"";
  return`${b.payMethod?`<span class="pill rose">${PAY_LABEL[b.payMethod]||""}</span>`:""}${billIsPaid(b)?`<span class="pill good">✓ Đã thanh toán</span>`:`<span class="pill warn">⏳ Chưa thanh toán</span>`}`;
}

function renderSalesPos(){
  if(!isMob())topBtn("＋ Lập hóa đơn","primary",()=>openBillModal());
  const c=document.getElementById("content");
  const bills=DB.bills||[];
  const legacySales=DB.transactions.filter(t=>t.type==="sale");
  const todayStr=new Date().toISOString().slice(0,10);
  const todayRev=bills.filter(b=>b.date===todayStr).reduce((s,b)=>s+b.total,0)+legacySales.filter(t=>t.date===todayStr).reduce((s,t)=>s+t.qty*t.unitPrice,0);
  const totalRev=bills.reduce((s,b)=>s+b.total,0)+legacySales.reduce((s,t)=>s+t.qty*t.unitPrice,0);
  const totalProfit=bills.reduce((s,b)=>s+b.profit,0)+legacySales.reduce((s,t)=>s+t.qty*(t.unitPrice-t.unitCost),0);
  const unpaid=bills.filter(b=>!billIsPaid(b));
  c.innerHTML=`
    <div class="stat-grid">
      <div class="stat"><div class="label">📅 Hôm nay</div><div class="val rose">${money(todayRev)}</div><div class="foot">${fmtDate(todayStr)}</div></div>
      <div class="stat"><div class="label">💰 Tổng doanh thu</div><div class="val rose">${money(totalRev)}</div></div>
      <div class="stat"><div class="label">⏳ Chưa thu</div><div class="val" style="color:${unpaid.length?"var(--warn)":"inherit"}">${money(unpaid.reduce((s,b)=>s+b.total,0))}</div><div class="foot">${unpaid.length} hóa đơn chưa thanh toán</div></div>
      <div class="stat"><div class="label">📋 Số hóa đơn</div><div class="val">${fmt(bills.length+legacySales.length)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Lịch sử hóa đơn</h2>${!isMob()?`<button class="btn primary" onclick="openBillModal()">＋ Lập hóa đơn</button>`:""}</div>
      <div id="billList"></div>
    </div>`;
  let salePeriod="all",salePay="all";
  function drawBillHistory(){
    let all=[
      ...bills.map(b=>({...b,_isBill:true})),
      ...legacySales.map(t=>({...t,_isBill:false,total:t.qty*t.unitPrice,profit:t.qty*(t.unitPrice-t.unitCost),items:[{productId:t.productId,qty:t.qty,unitPrice:t.unitPrice,unitCost:t.unitCost}]}))
    ].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
    const today=new Date().toISOString().slice(0,10);
    const wk=new Date(Date.now()-6*86400000).toISOString().slice(0,10);
    const mo=new Date().toISOString().slice(0,8)+"01";
    if(salePeriod==="today")all=all.filter(b=>b.date===today);
    else if(salePeriod==="week")all=all.filter(b=>b.date>=wk);
    else if(salePeriod==="month")all=all.filter(b=>b.date>=mo);
    if(salePay==="unpaid")all=all.filter(b=>b._isBill&&!billIsPaid(b));
    else if(salePay==="paid")all=all.filter(b=>!b._isBill||billIsPaid(b));
    const wrap=document.getElementById("billList");
    if(!all.length){wrap.innerHTML=`<div class="panel-body">${emptyState("💰","Không có hóa đơn","Tạo hóa đơn đầu tiên.","＋ Lập hóa đơn",()=>openBillModal())}</div>`;return;}
    const sumTotal=all.reduce((s,b)=>s+b.total,0);
    const sumProfit=all.reduce((s,b)=>s+b.profit,0);
    if(isMob()){
      wrap.innerHTML=`<div style="padding:9px 12px;background:var(--surface-2);font-size:13px;display:flex;gap:12px;border-bottom:1px solid var(--line)"><b>${all.length} hóa đơn</b><span style="margin-left:auto">Tổng: <b style="color:var(--rose-deep)">${money(sumTotal)}</b></span></div><div class="card-list" style="padding:12px">${all.map(b=>{
        const cust=byId(DB.customers,b.customerId||b.partyId);
        const custN=(cust||{}).name||"Khách lẻ";
        const pts=b._isBill&&cust?(cust.pointsHistory||[]).find(h=>h.billId===b.id):null;
        const prodSumm=b._isBill?`${b.items.length} sản phẩm`:`${(productById(b.items[0].productId)||{}).name||"(đã xoá)"} ×${b.items[0].qty}`;
        return`<div class="txn-card${b._isBill?" clickable":""}"${b._isBill?` onclick="openBillDetail('${b.id}')"`:""}><div class="txn-card-top"><span class="pill sale">Bán</span><div class="grow"><div class="prod-name" style="font-size:14px">${esc(prodSumm)}</div><div class="txn-card-meta">${b._isBill?`<b>${billCode(b)}</b> · `:""}${fmtDate(b.date)} · ${esc(custN)}</div></div><button class="icon-btn" style="width:32px;height:32px;font-size:13px" onclick="event.stopPropagation();${b._isBill?`delBill('${b.id}')`:`delTxn('${b.id}')`}">🗑</button></div><div class="txn-card-nums">${b.discount?`<div><span class="lbl">Giảm</span><b style="color:var(--warn)">-${b.discountType==="percent"?b.discount+"%":money(b.discount)}</b></div>`:""}<div><span class="lbl">Thành tiền</span><b>${money(b.total)}</b></div>${pts?`<div><span class="lbl">Tích điểm</span><b style="color:#b07d00">+${pts.earned}⭐</b></div>`:""}</div>${b._isBill?`<div class="pay-row">${billPayPills(b)}${billIsPaid(b)?`<span class="bd-more">Xem chi tiết ›</span>`:`<button class="btn sm primary" onclick="event.stopPropagation();markBillPaid('${b.id}')">💰 Thu tiền</button>`}</div>`:""}${b.note?`<div style="font-size:12px;color:var(--ink-soft);margin-top:6px">${esc(b.note)}</div>`:""}</div>`;
      }).join("")}</div>`;
      return;
    }
    wrap.innerHTML=`<div class="table-wrap" style="border:0;border-radius:0;box-shadow:none"><table><thead><tr><th>Ngày</th><th>Sản phẩm</th><th>Khách hàng</th><th class="num">Giảm</th><th class="num">Thành tiền</th><th>Thanh toán</th><th class="num">Điểm</th><th></th></tr></thead><tbody>${all.map(b=>{
      const cust=byId(DB.customers,b.customerId||b.partyId);
      const custN=(cust||{}).name||"Khách lẻ";
      const pts=b._isBill&&cust?(cust.pointsHistory||[]).find(h=>h.billId===b.id):null;
      const prodSumm=b._isBill?b.items.map(i=>`${(productById(i.productId)||{}).name||"?"} ×${i.qty}`).join(", "):`${(productById(b.items[0].productId)||{}).name||"(đã xoá)"} ×${b.items[0].qty}`;
      return`<tr${b._isBill?` class="clickable" onclick="openBillDetail('${b.id}')"`:""}><td>${fmtDate(b.date)}${b._isBill?`<div class="prod-sku">${billCode(b)}</div>`:""}</td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(prodSumm)}">${esc(prodSumm)}</td><td>${esc(custN)}</td><td class="num">${b.discount?(b.discountType==="percent"?b.discount+"%":money(b.discount)):"—"}</td><td class="num"><b style="color:var(--rose-deep)">${money(b.total)}</b></td><td>${b._isBill?`<div class="pay-row" style="margin:0">${billPayPills(b)}${billIsPaid(b)?"":`<button class="btn sm primary" onclick="event.stopPropagation();markBillPaid('${b.id}')">💰 Thu tiền</button>`}</div>`:"—"}</td><td class="num">${pts?`<span class="pts-badge">+${pts.earned}⭐</span>`:"—"}</td><td class="row-actions"><button class="icon-btn" onclick="event.stopPropagation();${b._isBill?`delBill('${b.id}')`:`delTxn('${b.id}')`}">🗑</button></td></tr>`;
    }).join("")}<tr style="background:var(--surface-2);font-weight:700"><td colspan="4" style="padding:12px 13px">Tổng (${all.length} hóa đơn)</td><td class="num" style="color:var(--rose-deep)">${money(sumTotal)}</td><td colspan="3"></td></tr></tbody></table></div>`;
  }
  // Filter toolbar
  document.getElementById("billList").insertAdjacentHTML("beforebegin",`<div class="toolbar" style="padding:12px 16px 0"><select class="filter" id="salePeriodF"><option value="all">Tất cả thời gian</option><option value="today">Hôm nay</option><option value="week">7 ngày qua</option><option value="month">Tháng này</option></select><select class="filter" id="salePayF"><option value="all">Mọi trạng thái</option><option value="unpaid">⏳ Chưa thanh toán</option><option value="paid">✓ Đã thanh toán</option></select></div>`);
  document.getElementById("salePeriodF").value=salePeriod;
  document.getElementById("salePeriodF").onchange=e=>{salePeriod=e.target.value;drawBillHistory();};
  document.getElementById("salePayF").value=salePay;
  document.getElementById("salePayF").onchange=e=>{salePay=e.target.value;drawBillHistory();};
  drawBillHistory();
}

const BACKUP_KEY="myphamHH_lastBackup";

const lastBackupAt=()=>{try{return +(localStorage.getItem(BACKUP_KEY)||0);}catch(e){return 0;}};
const setBackupAt=t=>{try{localStorage.setItem(BACKUP_KEY,String(t));}catch(e){}};

async function doExportBackup(){
  const data=JSON.parse(JSON.stringify(DB));
  data._exportedAt=Date.now();data._version=1;
  // Kèm hoá đơn điện tử nếu có
  if(CLOUD){try{
    const ids=(DB.bills||[]).map(b=>b.receiptId).filter(Boolean);
    data.receipts=[];
    for(const id of ids){const r=await CB.get("receipts",id);if(r)data.receipts.push({id,...r});}
  }catch(e){}}
  const date=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`hoanghien-saoluu-${date}.json`;a.click();URL.revokeObjectURL(a.href);
  setBackupAt(Date.now());toast("✓ Đã tải file sao lưu");
}

function billAddItem(){
  const p=productById(document.getElementById("bProd").value);
  if(!p){toast("Chọn sản phẩm");return;}
  const qty=Math.max(1,+document.getElementById("bQty").value||1);
  const unitPrice=+document.getElementById("bUPrice").value||p.price;
  const existing=billCart.find(i=>i.productId===p.id);
  if(existing){existing.qty+=qty;existing.unitPrice=unitPrice;}
  else billCart.push({productId:p.id,qty,unitPrice,unitCost:p.cost});
  // clamp to stock
  const totalQty=billCart.filter(i=>i.productId===p.id).reduce((s,i)=>s+i.qty,0);
  if(totalQty>p.stock){const ci=billCart.find(i=>i.productId===p.id);if(ci)ci.qty=Math.max(1,p.stock-billCart.filter(i=>i.productId===p.id&&i!==ci).reduce((s,i)=>s+i.qty,0));toast(`⚠️ Kho chỉ còn ${p.stock}`);}
  document.getElementById("bQty").value=1;
  renderBillCart();
}
function scanInfoHtml(code,p,extra=""){
  const head=`<div class="scan-code">Mã vừa quét: <b>${esc(code)}</b></div>`;
  if(!p)return head+`<div class="scan-miss">Mã này chưa có trong cửa hàng.</div>`+extra;
  return head+`<div class="scan-prod">${thumbHtml(p,46)}<div class="grow"><div class="scan-name">${esc(p.name)}</div>
    <div class="scan-meta">${money(p.price)} · Tồn ${fmt(p.stock)}${p.brand?` · ${esc(p.brand)}`:""}${p.volume?` · ${esc(p.volume)}`:""}</div></div></div>`+extra;
}
function billScanQR(){
  openQRScanner(code=>{
    const info=document.getElementById("billScanInfo");
    const show=(cls,html)=>{if(info){info.hidden=false;info.className="scan-info "+cls;info.innerHTML=html;}};
    const p=findProductByCode(code);
    if(!p){show("warn",scanInfoHtml(code,null,`<div class="scan-note">Thêm mã này ở <b>Nhập hàng → Quét mã → Tạo mặt hàng mới</b>.</div>`));return;}
    const inCart=billCart.find(i=>i.productId===p.id),qty=inCart?inCart.qty:0;
    if(p.stock<=qty){show("warn",scanInfoHtml(code,p,`<div class="scan-note">${p.stock<=0?"Sản phẩm đã hết hàng.":`Kho chỉ còn ${p.stock}, hoá đơn đã đủ số lượng.`}</div>`));return;}
    if(inCart)inCart.qty++;else billCart.push({productId:p.id,qty:1,unitPrice:p.price,unitCost:p.cost});
    renderBillCart();
    show("ok",scanInfoHtml(code,p,`<div class="scan-note">✓ Đã thêm vào hoá đơn · số lượng: <b>${qty+1}</b></div>`));
  });
}

function filterPickerProds(q){

function renderPickerGrid(prods){

        <span style="font-size:12px;color:var(--rose-deep);margin-left:2px">${money(inCart.qty*inCart.unitPrice)}</span>

function billAddFromPicker(productId){
  const p=productById(productId);if(!p||p.stock<=0)return;
  const existing=billCart.find(i=>i.productId===p.id);
  if(existing){if(existing.qty<p.stock)existing.qty++;else{toast(`⚠️ Kho chỉ còn ${p.stock}`);return;}}
  else billCart.push({productId:p.id,qty:1,unitPrice:p.price,unitCost:p.cost});
  filterPickerProds(document.getElementById("ppQ")?.value||"");
  // update Xong button count
  const xongBtn=document.querySelector(".modal-foot .btn.primary");
  if(xongBtn)xongBtn.textContent=`✓ Xong (${billCart.reduce((s,i)=>s+i.qty,0)} sản phẩm)`;
}
function billPickQty(productId,delta){
  const item=billCart.find(i=>i.productId===productId);if(!item)return;
  const p=productById(productId);
  item.qty+=delta;
  if(item.qty<=0){billCart=billCart.filter(i=>i.productId!==productId);}
  else if(p&&item.qty>p.stock){item.qty=p.stock;toast(`⚠️ Kho chỉ còn ${p.stock}`);}
  filterPickerProds(document.getElementById("ppQ")?.value||"");
  const xongBtn=document.querySelector(".modal-foot .btn.primary");
  if(xongBtn)xongBtn.textContent=`✓ Xong (${billCart.reduce((s,i)=>s+i.qty,0)} sản phẩm)`;
}
function billRemoveItem(idx){billCart.splice(idx,1);renderBillCart();}
function billUpdateQty(idx,val){
  const item=billCart[idx];if(!item)return;
  const p=productById(item.productId);
  item.qty=Math.max(1,+val||1);
  if(p&&item.qty>p.stock){item.qty=p.stock;toast(`Kho chỉ còn ${p.stock}`);}
  updateBillSummary();
  // re-render price cell
  const cell=document.getElementById("bcell_"+idx);
  if(cell)cell.textContent=money(item.qty*item.unitPrice);
}

        ${addRow}
      </tbody>
    </table>
  </div>`;
  updateBillSummary();
}
function onBillProdSelectChange(){
  const sel=document.getElementById("bProd");
  const pi=document.getElementById("bUPrice");
  if(!sel||!pi)return;
  const p=productById(sel.value);if(p)pi.value=p.price;
}
function getBillCalc(){
  const subtotal=billCart.reduce((s,i)=>s+i.qty*i.unitPrice,0);
  const d=Math.max(0,+((document.getElementById("bDisc")||{}).value)||0);
  const discAmt=Math.min(subtotal,billDiscType==="percent"?Math.round(subtotal*Math.min(d,100)/100):d);
  const total=Math.max(0,subtotal-discAmt);
  const cost=billCart.reduce((s,i)=>s+i.qty*i.unitCost,0);
  return{subtotal,discAmt,total,profit:total-cost};
}
function updateBillSummary(){
  const el=document.getElementById("billSummary");if(!el)return;
  if(!billCart.length){el.innerHTML="";renderPayQR();return;}
  const {subtotal,discAmt,total,profit}=getBillCalc();
  el.innerHTML=`<div class="s-row"><span style="color:var(--ink-soft)">Tạm tính:</span><span>${money(subtotal)}</span></div>${discAmt?`<div class="s-row" style="color:var(--warn)"><span>Giảm giá:</span><span>-${money(discAmt)}</span></div>`:""}<div class="s-row s-total"><span>Tổng cộng:</span><span style="color:var(--rose-deep)">${money(total)}</span></div>`;
  renderPayQR();
}
function saveBill(andPrint){
  if(!billCart.length){toast("Chưa có sản phẩm trong hóa đơn");return;}
  for(const item of billCart){
    const p=productById(item.productId);
    const need=billCart.filter(i=>i.productId===item.productId).reduce((s,i)=>s+i.qty,0);
    if(!p){toast("Có sản phẩm đã bị xoá khỏi kho, hãy bỏ khỏi hóa đơn");return;}
    if(need>p.stock){toast(`Không đủ hàng: ${p.name} chỉ còn ${p.stock}`);return;}
  }
  const {subtotal,discAmt,total,profit}=getBillCalc();
  const d=Math.max(0,+document.getElementById("bDisc").value||0);
  for(const item of billCart){const p=productById(item.productId);if(p)p.stock=Math.max(0,p.stock-item.qty);}
  if(!DB.bills)DB.bills=[];
  const billId=uid();
  DB.bills.push({id:billId,createdAt:Date.now(),...(CLOUD?{receiptId:newReceiptId()}:{}),date:document.getElementById("bDate").value||new Date().toISOString().slice(0,10),customerId:document.getElementById("bCust").value,items:billCart.map(i=>({...i})),discount:d,discountType:billDiscType,note:document.getElementById("bNote").value.trim(),subtotal,discAmt,total,profit,
    payMethod:billPayMethod,paid:billPaid,...(billPaid?{paidAt:Date.now()}:{})});
  billCart=[];
  // Tích điểm cho khách hàng (1 điểm / 10,000₫)
  const custId=document.getElementById("bCust").value;
  let toastMsg=`✓ Đã lưu hóa đơn ${money(total)} · ${billPaid?PAY_LABEL[billPayMethod]:"⏳ Chưa thanh toán"}`;
  if(custId){
    const cust=byId(DB.customers,custId);
    if(cust){
      const earned=Math.floor(total/10000);
      cust.points=(cust.points||0)+earned;
      if(!cust.pointsHistory)cust.pointsHistory=[];
      cust.pointsHistory.push({date:document.getElementById("bDate").value,billId,earned,balance:cust.points});
      if(earned>0)toastMsg+=` · Tích +${fmt(earned)} điểm`;
    }
  }
  save();syncReceipt(byId(DB.bills,billId));closeModal();toast(toastMsg);go(current);
  if(andPrint)printBill(billId);
}

const BANK={bin:"970407",code:"TCB",name:"Techcombank",acc:"1510038386",holder:"MY PHAM HOANG HIEN"};
const BANK_KEY="myphamHH_bank";
function getBank(){try{return Object.assign({},BANK,JSON.parse(localStorage.getItem(BANK_KEY)||"null"));}catch(e){return BANK;}}
function saveBank(b){try{localStorage.setItem(BANK_KEY,JSON.stringify(b));}catch(e){}}
// Mã rút gọn của hoá đơn, nhúng vào nội dung chuyển khoản để đối chiếu tự động về sau
function vietqrUrl(amount,ref){
  const b=getBank();
  const acc=String(b.acc||"").replace(/\s+/g,"");
  if(!acc)return"";
  const bin=b.bin||b.code||"970407";
  const q=new URLSearchParams();
  if(amount>0)q.set("amount",Math.round(amount));
  if(ref)q.set("addInfo",String(ref).slice(0,25));
  if(b.holder)q.set("accountName",b.holder);
  return`https://img.vietqr.io/image/${encodeURIComponent(bin)}-${encodeURIComponent(acc)}-compact2.png?${q}`;
}
function vietqrBlock(amount,ref){
  const b=getBank(),acc=String(b.acc||"").replace(/\s+/g,"");
  if(!acc||!amount)return"";
  return`<div class="vqr">
    <div class="vqr-h">📱 Quét mã để chuyển khoản</div>
    <img class="vqr-img" src="${vietqrUrl(amount,ref)}" alt="Mã QR chuyển khoản" loading="lazy">
    <div class="vqr-amt">${money(amount)}</div>
    <div class="vqr-info">
      <div class="vqr-row"><span>Ngân hàng</span><b>${esc(b.name||"")}</b></div>

    </div>

/* ---- Hoá đơn điện tử: bản sao công khai của hoá đơn, mở bằng link có mã ngẫu nhiên ---- */
function newReceiptId(){const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",r=crypto.getRandomValues(new Uint8Array(22));return[...r].map(x=>a[x%a.length]).join("");}
const receiptUrl=b=>new URL("hd.html?id="+b.receiptId,location.href).href;
const maskPhone=p=>{const d=String(p||"").replace(/\D/g,"");return d.length>=7?d.slice(0,3)+"****"+d.slice(-3):"";};
function receiptData(b,status="active"){
  const {cust,pts,items,when}=billView(b);
  const bk=getBank();
  return{code:billCode(b),when,customer:cust?cust.name:"Khách lẻ",phone:cust?maskPhone(cust.phone):"",
    items:items.map(i=>({name:i.name,qty:i.qty,price:i.price,total:i.total})),
    subtotal:b.subtotal,discAmt:b.discAmt||0,discLabel:b.discAmt&&b.discountType==="percent"?`${b.discount}%`:"",total:b.total,
    paid:billIsPaid(b),payMethod:b.payMethod||"",points:pts?pts.earned:0,note:b.note||"",status,shop:SHOP,
    // Thêm thông tin ngân hàng + QR VietQR để trang khách tự dựng được, không cần đăng nhập
    bank:bk.acc?{bin:bk.bin,name:bk.name,acc:bk.acc,holder:bk.holder}:null,
    qrUrl:bk.acc?vietqrUrl(b.total,billCode(b)):"",
    updatedAt:Date.now()};
}
function syncReceipt(b,status){
  if(!CLOUD||!b||!b.receiptId)return;
  CB.commit([{op:"set",col:"receipts",id:b.receiptId,data:receiptData(b,status)}]).catch(e=>toast("Chưa lưu được hoá đơn điện tử: "+cloudErrText(e)));
}
function ensureReceipt(b){
  if(!CLOUD||b.receiptId)return;
  b.receiptId=newReceiptId();save();syncReceipt(b);
}
function shareReceipt(id){
  const b=byId(DB.bills||[],id);if(!b||!b.receiptId)return;
  const url=receiptUrl(b),title=`Hóa đơn ${billCode(b)} – ${SHOP.name}`;
  if(navigator.share)navigator.share({title,text:`${title}: ${money(b.total)}`,url}).catch(()=>{});
  else copyReceipt(id);
}
function copyReceipt(id){
  const b=byId(DB.bills||[],id);if(!b||!b.receiptId)return;
  const url=receiptUrl(b);
  (navigator.clipboard?.writeText(url)||Promise.reject()).then(()=>toast("Đã sao chép link hóa đơn"),()=>toast(url));
}
function qrDataUrl(text,size=160){
  const tmp=document.createElement("div");
  try{new QRCode(tmp,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});return tmp.querySelector("canvas")?.toDataURL()||"";}catch(e){return"";}
}
window.shareReceipt=shareReceipt;window.copyReceipt=copyReceipt;

/* ======= MODALS ======= */
function mountModal(html,opts={}){
  const m=document.getElementById("modalMount");
  m.innerHTML=`<div class="modal-back${opts.dialog?" is-dialog":""}${opts.locked?" is-locked":""}" id="mBack">${html}</div>`;
  const back=document.getElementById("mBack");
  const head=back.querySelector(".modal-head");
  if(head&&!opts.dialog&&!opts.locked){
    head.insertAdjacentHTML("afterbegin",`<button type="button" class="modal-backbtn" aria-label="Quay lại">←</button>`);
    head.firstElementChild.onclick=()=>closeModal();
  }
  // Form bị khoá (hoá đơn, nhập hàng, mặt hàng) chỉ thoát bằng nút ✕
  if(opts.locked)return syncModalHistory();
  // Máy tính: bấm ra ngoài để đóng. Điện thoại: form là trang riêng, chỉ hộp xác nhận mới đóng khi chạm ra ngoài
  back.addEventListener("mousedown",e=>{if(e.target.id==="mBack")closeModal();});
  let moved=false;
  back.addEventListener("touchstart",()=>{moved=false;},{passive:true});
  back.addEventListener("touchmove",()=>{moved=true;},{passive:true});
  back.addEventListener("touchend",e=>{if(!moved&&e.target.id==="mBack")closeModal();},{passive:true});
  syncModalHistory();
}
// Mở form con (VD: Thêm mặt hàng từ trong Nhập hàng): cất form cha, đóng form con thì trả form cha lại nguyên vẹn
let _modalParents=[];
function pushModal(onReturn){const m=document.getElementById("modalMount");const node=m.firstElementChild;if(node)node.remove();_modalParents.push({node,onReturn});}
function closeModal(){
  if(_qrOpen){stopQR();return;}
  const m=document.getElementById("modalMount");m.innerHTML="";
  const top=_modalParents.pop();if(top&&top.node)m.appendChild(top.node);
  syncModalHistory();
  if(top&&top.onReturn)top.onReturn();
  if(cloudDirty)cloudRerender();
}
window.closeModal=closeModal;

/* Mỗi lớp form đang mở = một bước trong lịch sử trình duyệt: vuốt/bấm Back trên điện thoại sẽ đóng form thay vì thoát app */
function modalDepth(){
  return (document.getElementById("modalMount").firstElementChild?1:0)+_modalParents.filter(x=>x.node).length+(_qrOpen&&_qrPrevModal?1:0);
}
// Gom các thay đổi trong cùng một lượt rồi mới chỉnh lịch sử; history.go chạy trễ nên phải chờ lùi xong mới pushState
function syncModalHistory(){
  document.body.classList.toggle("modal-open",modalDepth()>0);
  if(!_syncTimer)_syncTimer=setTimeout(reconcileHistory,0);
}
function reconcileHistory(){
  _syncTimer=0;
  if(_navBusy)return;
  const want=modalDepth();
  if(_histDepth>want){const n=_histDepth-want;_histDepth=want;_navBusy=true;_ignorePop++;history.go(-n);return;}
  if(_pendingView&&_histDepth===0){if(_pendingView!==viewFromHash())history.pushState({view:_pendingView},"","#/"+_pendingView);_pendingView=null;}
  while(_histDepth<want){history.pushState({modal:_histDepth+1,view:current},"");_histDepth++;}
}
addEventListener("popstate",e=>{
  if(_ignorePop>0){_ignorePop--;_navBusy=false;reconcileHistory();return;}
  if(_histDepth>0){
    // Form bị khoá: giữ nguyên, trả lại bước lịch sử vừa bị lùi
    if(document.querySelector("#modalMount > .is-locked")&&!_qrOpen){history.pushState({modal:_histDepth,view:current},"");toast("Nhấn ✕ ở góc phải để thoát");return;}
    _histDepth--;closeModal();return;
  }
  const v=(e.state&&e.state.view)||viewFromHash()||"dashboard";
  if(VIEWS[v]&&v!==current&&!document.getElementById("appWrap").hidden)go(v,{fromPop:true});
});

}

      <div class="scan-info" id="scanInfo" hidden></div>

        <div class="field"><label>Số lượng *</label><input id="tQty" type="number" min="1" inputmode="numeric" value="1"></div>
        <div class="field"><label>Giá bán (₫) *</label><input id="tPrice" type="number" min="0" inputmode="numeric"></div>
      </div>`:`<div class="field"><label>Số lượng *</label><input id="tQty" type="number" min="1" inputmode="numeric" value="1"></div>
      <input id="tPrice" type="hidden" value="0">`}

  const fillPrice=()=>{const p=productById(prodSel.value);if(p&&isSale)priceIn.value=p.price;updateSum();};
  const updateSum=()=>{
    const p=productById(prodSel.value);const qty=+qtyIn.value||0;const price=+priceIn.value||0;
    let html="";
    if(isSale){html=`Thành tiền: <b>${money(qty*price)}</b>`;if(p&&qty>p.stock)html+=`<br><span style="color:var(--warn)">⚠️ Kho chỉ còn ${p.stock}</span>`;}
    else if(p)html=`Tồn sau nhập: <b>${fmt(p.stock+qty)}</b>`;
    document.getElementById("tSummary").innerHTML=html;
  };
  prodSel.addEventListener("change",fillPrice);
  qtyIn.addEventListener("input",updateSum);priceIn.addEventListener("input",updateSum);
  fillPrice();
  const info=document.getElementById("scanInfo");let infoPid="";
  const selectProduct=p=>{
    if(catSel&&catSel.value&&catSel.value!==p.category)catSel.value="";
    prodSel.innerHTML=makeProdOpts(catSel?catSel.value:"");prodSel.value=p.id;fillPrice();
  };
  const showFound=(code,p,note)=>{infoPid=p.id;info.hidden=false;info.className="scan-info ok";info.innerHTML=scanInfoHtml(code,p,note?`<div class="scan-note">${note}</div>`:"");};
  prodSel.addEventListener("change",()=>{if(infoPid&&prodSel.value!==infoPid){info.hidden=true;infoPid="";}});
  const scanBtnEl=document.getElementById("scanBtn");
  if(scanBtnEl)scanBtnEl.onclick=()=>openQRScanner(code=>{
    const found=findProductByCode(code);
    if(found){selectProduct(found);showFound(code,found);return;}
    infoPid="";info.hidden=false;info.className="scan-info warn";
    if(isSale){info.innerHTML=scanInfoHtml(code,null,`<div class="scan-note">Hãy nhập hàng cho mã này trước khi bán.</div>`);return;}
    info.innerHTML=scanInfoHtml(code,null,`<div class="scan-actions">
      <button type="button" class="btn primary sm" id="scanNew">➕ Tạo mặt hàng mới với mã này</button>
      ${DB.products.length?`<button type="button" class="btn ghost sm" id="scanLink">🔗 Gán mã cho sản phẩm đang chọn bên dưới</button>`:""}
    </div>`);
    document.getElementById("scanNew").onclick=()=>openProductModal(null,{sku:code,fromPurchase:true,onDone:p=>{
      selectProduct(p);showFound(code,p,"Đã tạo mặt hàng mới. Nhập số lượng, giá rồi bấm <b>Ghi nhận nhập</b>.");
    }});
    const link=document.getElementById("scanLink");
    if(link)link.onclick=()=>{
      const p=productById(prodSel.value);if(!p){toast("Chọn sản phẩm trước");return;}
      addBarcodeToProduct(p,code);save();selectProduct(p);
      showFound(code,p,"Đã lưu mã cho sản phẩm này. Lần sau quét mã sẽ ra đúng sản phẩm.");
    };
  });
  // Nhập hàng: quét hàng loạt — chọn sản phẩm trước, mỗi lần quét 1 hộp là +1 số lượng
  const batchBtn=document.getElementById("batchBtn");
  if(batchBtn)batchBtn.onclick=()=>{
    const p=productById(prodSel.value);
    if(!p){toast("Chọn mặt hàng trước khi quét hàng loạt");prodSel.focus();return;}
    openBatchScanner(p,n=>{qtyIn.value=(+qtyIn.value||0)+n;updateSum();});
  };
  document.getElementById("saveTxn").onclick=()=>{
    const p=productById(prodSel.value);if(!p){toast("Chọn sản phẩm");return;}
    const qty=+qtyIn.value||0,price=+priceIn.value||0;
    if(qty<=0){toast("Số lượng phải lớn hơn 0");return;}
    if(price<0){toast("Giá không hợp lệ");return;}
    if(isSale&&qty>p.stock){toast(`Không đủ hàng — kho chỉ còn ${p.stock}`);return;}
    const txn={id:uid(),type,date:document.getElementById("tDate").value||new Date().toISOString().slice(0,10),productId:p.id,qty,unitPrice:price,unitCost:p.cost,partyId:document.getElementById("tParty").value,note:document.getElementById("tNote").value.trim()};
    if(isSale)p.stock-=qty;else p.stock+=qty;
    DB.transactions.push(txn);save();closeModal();
    toast(isSale?`Đã bán ${qty} × ${p.name}`:`Đã nhập ${qty} × ${p.name}`);go(current);
  };
}

/* ======= QR ======= */
let qrStream=null,qrAF=null,qrZXReader=null,_qrFoundCb=null,_qrOpen=false,_qrPrevModal=null,qrSession=0;
let _bdPromise=null,_bdKind="";
const BD_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code","data_matrix"];

function loadZXingLib(){
  if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return Promise.resolve(window.ZXing);
  return new Promise(resolve=>{
    const s=document.createElement("script");
    // v0.18.6: BrowserMultiFormatReader vẫn còn trong package chính
    s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js";
    s.onload=()=>resolve((window.ZXing&&window.ZXing.BrowserMultiFormatReader)?window.ZXing:null);
    s.onerror=()=>resolve(null);
    document.head.appendChild(s);
  });
}

// Android/macOS có BarcodeDetector sẵn; iPhone/Windows dùng ZXing-C++ (WebAssembly) qua cùng API
function getBarcodeDetector(){
  if(_bdPromise)return _bdPromise;
  _bdPromise=(async()=>{
    if("BarcodeDetector" in window){
      try{
        const sup=await BarcodeDetector.getSupportedFormats();
        if(sup.includes("ean_13")){_bdKind="native";return new BarcodeDetector({formats:BD_FORMATS.filter(f=>sup.includes(f))});}
      }catch(e){}
    }
    try{
      const m=await import("https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/es/pure.min.js");
      const det=new m.BarcodeDetector({formats:BD_FORMATS});
      const warm=document.createElement("canvas");warm.width=warm.height=8;
      await det.detect(warm);
      _bdKind="wasm";return det;
    }catch(e){_bdPromise=null;return null;}
  })();
  return _bdPromise;
}

function openQRScanner(onFound){
  // Tách form đang mở (Nhập hàng, Thêm sản phẩm…) ra để trả lại nguyên vẹn khi đóng màn hình quét
  if(_qrOpen)stopQR(false);
  else{const m=document.getElementById("modalMount");_qrPrevModal=m.firstElementChild;if(_qrPrevModal)_qrPrevModal.remove();}
  _qrOpen=true;_qrFoundCb=onFound;
  const sid=++qrSession;
  const alive=()=>sid===qrSession&&!!document.getElementById("qrVid");
  const touch=isMob()||matchMedia("(pointer:coarse)").matches;
  getBarcodeDetector();
  mountModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><h2>📷 Quét mã vạch / QR</h2><button class="icon-btn" onclick="stopQR()">✕</button></div>
    <div class="modal-body" style="padding:12px;text-align:center">
      <div id="qrBox" style="position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:50vh">
        <video id="qrVid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
          <div class="qr-frame"><div class="qr-scan-line"></div></div>
        </div>
      </div>
      <div id="qrStat" style="margin:10px 0 4px;font-size:13px;min-height:36px;color:var(--ink-soft)">Đang khởi động camera…</div>
    </div>
    <div class="modal-foot" style="display:flex;flex-direction:column;gap:8px">
      <label class="btn ${touch?"primary":"secondary"}" ${touch?'onclick="qrPhotoMode()"':""} style="width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
        ${touch?"📸 Chụp ảnh mã vạch":"📁 Chọn ảnh chứa mã vạch"}
        <input type="file" accept="image/*" ${touch?'capture="environment"':""} id="qrImgInput" hidden onchange="scanFromImageFile()">
      </label>
      <button class="btn ghost" style="width:100%" onclick="stopQR()">Huỷ</button>
    </div>
  </div>`);

  const stat=document.getElementById("qrStat"),vid=document.getElementById("qrVid");
  const found=val=>{if(alive())qrDone(val);};
  const photoTip=`<br><small>Hoặc bấm ${touch?"📸 Chụp ảnh":"📁 Chọn ảnh"} bên dưới.</small>`;

  if(!navigator.mediaDevices?.getUserMedia){
    stat.innerHTML=`<span style="color:var(--bad)">Không mở được camera trực tiếp.</span>${photoTip}`;
    return;
  }

  const startZXingVideo=()=>{
    loadZXingLib().then(Z=>{
      if(!alive())return;
      if(!Z?.BrowserMultiFormatReader){stat.innerHTML=`<span style="color:var(--bad)">Không tải được bộ đọc mã vạch, kiểm tra mạng.</span>`;return;}
      stat.textContent="Đưa mã vạch vào khung, giữ mã nằm ngang…";
      try{
        qrZXReader=new Z.BrowserMultiFormatReader(zxHints());
        qrZXReader.decodeFromVideoElementContinuously(vid,r=>{if(r)found(r.getText());});
      }catch(e){}
    });
  };

  const startScan=()=>{
    if(!alive())return;
    stat.textContent="Đang tải bộ đọc mã vạch…";
    getBarcodeDetector().then(bd=>{
      if(!alive())return;
      if(!bd){startZXingVideo();return;}
      stat.textContent="Đưa mã vạch vào khung, giữ mã nằm ngang…";
      const loop=()=>{
        if(!alive())return;
        if(vid.readyState>=2&&vid.videoWidth){
          bd.detect(vid).then(c=>{if(!alive())return;if(c.length)found(c[0].rawValue);else qrAF=setTimeout(loop,100);})
            .catch(()=>{if(alive())qrAF=setTimeout(loop,300);});
        }else qrAF=setTimeout(loop,200);
      };
      loop();
    });
  };

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})
    .then(stream=>{
      if(!alive()){stream.getTracks().forEach(t=>t.stop());return;}
      qrStream=stream;
      vid.srcObject=stream;vid.play().catch(()=>{});
      if(vid.readyState>=2)startScan();else vid.addEventListener("loadeddata",startScan,{once:true});
    })
    .catch(err=>{
      if(!alive())return;
      const msg=err.name==="NotAllowedError"?"Chưa cấp quyền camera (bấm 🔒 / aA trên thanh địa chỉ để cho phép).":
        err.name==="NotFoundError"?"Không tìm thấy camera.":
        err.name==="NotReadableError"?"Camera đang được ứng dụng khác dùng.":"Lỗi camera: "+esc(err.message);
      stat.innerHTML=`<span style="color:var(--bad)">${msg}</span>${photoTip}`;
    });
}

function stopQR(doClose=true){
  qrSession++;
  clearTimeout(qrAF);cancelAnimationFrame(qrAF);qrAF=null;
  if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null;}
  if(qrZXReader){try{qrZXReader.reset();}catch(e){}qrZXReader=null;}
  if(!doClose)return;
  _qrOpen=false;
  const m=document.getElementById("modalMount");m.innerHTML="";
  if(_qrPrevModal){m.appendChild(_qrPrevModal);_qrPrevModal=null;}
  syncModalHistory();
}

function qrDone(val){const cb=_qrFoundCb;stopQR();if(cb)cb(val);}

/* ======= QUÉT HÀNG LOẠT (nhập hàng) ======= */
let _batchP=null,_batchCount=0,_batchNewCodes=[],_batchLast="",_batchLastT=0,_batchDone=null,_bbStream=null,_bbReader=null,_bbAF=null,_bbCtx=null;
function openBatchScanner(product,onDone){
  _batchP=product;_batchCount=0;_batchNewCodes=[];_batchLast="";_batchLastT=0;_batchDone=onDone;
  try{_bbCtx=_bbCtx||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  pushModal();
  mountModal(`<div class="modal batch-modal">
    <div class="modal-head"><h2>📷 Quét hàng loạt</h2><button class="icon-btn" onclick="finishBatch()">✕</button></div>
    <div class="modal-body" style="padding:0;background:#000;position:relative">
      <div class="batch-top">
        <div class="batch-prod">${esc(product.name)}</div>
        <div class="batch-sub">${product.brand?esc(product.brand)+" · ":""}${product.volume?esc(product.volume)+" · ":""}Tồn hiện tại ${fmt(product.stock)}</div>
      </div>
      <div style="position:relative;background:#000;aspect-ratio:4/3;overflow:hidden">
        <video id="qrVid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
        <div class="batch-counter" id="batchCount">0</div>
        <div class="batch-flash" id="batchFlash"></div>
      </div>
      <div class="batch-log" id="batchLog"><div class="muted" style="padding:14px;text-align:center">Đưa mã vạch vào khung · tiếng beep báo đã đếm</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" style="flex:1;padding:14px" onclick="finishBatch()">✓ Xong (<span id="batchDoneN">0</span> cái)</button>
    </div>
  </div>`,{locked:true});
  startBatchCamera();
}
function startBatchCamera(){
  if(!navigator.mediaDevices?.getUserMedia){batchLog("err","Thiết bị không cho dùng camera. Mở trang qua HTTPS.");return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}}).then(stream=>{
    _bbStream=stream;const vid=document.getElementById("qrVid");if(!vid){stream.getTracks().forEach(t=>t.stop());return;}
    vid.srcObject=stream;vid.play().catch(()=>{});
    if("BarcodeDetector" in window){
      let detector;try{detector=new BarcodeDetector({formats:["qr_code","ean_13","ean_8","code_128","code_39","upc_a","upc_e","itf","data_matrix"]});}catch(e){}
      if(detector){const loop=()=>{if(!document.getElementById("qrVid"))return;if(vid.readyState>=2&&vid.videoWidth)detector.detect(vid).then(cs=>{if(cs&&cs.length)batchHit(cs[0].rawValue);_bbAF=setTimeout(loop,120);}).catch(()=>{_bbAF=setTimeout(loop,250);});else _bbAF=setTimeout(loop,200);};loop();return;}
    }
    loadZXingLib().then(Z=>{if(!document.getElementById("qrVid")||!Z?.BrowserMultiFormatReader)return;try{_bbReader=new Z.BrowserMultiFormatReader(zxHints());_bbReader.decodeFromVideoElementContinuously(vid,r=>{if(r)batchHit(r.getText());});}catch(e){}});
  }).catch(err=>{batchLog("err","Không mở được camera: "+(err.name||err.message));});
}
function batchHit(code){
  const now=Date.now();
  // chống đếm trùng: cùng mã trong 1500ms chỉ đếm một lần
  if(code===_batchLast&&now-_batchLastT<1500)return;
  _batchLast=code;_batchLastT=now;
  const other=findProductByCode(code);
  if(other&&other.id!==_batchP.id){batchLog("warn","Mã "+code+" là của: "+other.name);batchBeep(false);return;}
  if(!other){addBarcodeToProduct(_batchP,code);_batchNewCodes.push(code);batchLog("new","+1 · Học mã mới "+code);}
  else batchLog("ok","+1 · "+code);
  _batchCount++;batchFlash();batchBeep(true);
  const el=document.getElementById("batchCount");if(el)el.textContent=_batchCount;
  const n=document.getElementById("batchDoneN");if(n)n.textContent=_batchCount;
}
function batchLog(cls,msg){
  const log=document.getElementById("batchLog");if(!log)return;
  if(log.querySelector(".muted"))log.innerHTML="";
  const row=document.createElement("div");row.className="batch-line "+cls;row.innerHTML=`<span>${new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span>${esc(msg)}`;
  log.insertBefore(row,log.firstChild);while(log.children.length>8)log.lastChild.remove();
}
function batchFlash(){const f=document.getElementById("batchFlash");if(!f)return;f.classList.remove("on");void f.offsetWidth;f.classList.add("on");}
function batchBeep(ok){try{if(!_bbCtx)return;const t=_bbCtx.currentTime,o=_bbCtx.createOscillator(),g=_bbCtx.createGain();o.frequency.value=ok?1200:400;o.connect(g);g.connect(_bbCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.start(t);o.stop(t+.17);}catch(e){}}
function finishBatch(){
  clearTimeout(_bbAF);_bbAF=null;
  if(_bbReader){try{_bbReader.reset();}catch(e){}_bbReader=null;}
  if(_bbStream){_bbStream.getTracks().forEach(t=>t.stop());_bbStream=null;}
  if(_batchNewCodes.length&&_batchP)save();
  const n=_batchCount,cb=_batchDone;_batchP=null;_batchDone=null;
  closeModal();
  if(n>0)toast(`✓ Đã quét ${n} cái${_batchNewCodes.length?` · học ${_batchNewCodes.length} mã mới`:""}`);
  if(cb)cb(n);
}

function zxHints(){
  const Z=window.ZXing,F=Z.BarcodeFormat,h=new Map();
  h.set(Z.DecodeHintType.TRY_HARDER,true);
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE,F.DATA_MATRIX]);
  return h;
}

function drawScaledRotated(img,max,deg,cv){
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(W,H)),w=W*s,h=H*s;
  const r=deg*Math.PI/180,c=Math.abs(Math.cos(r)),n=Math.abs(Math.sin(r));
  cv.width=Math.ceil(w*c+h*n);cv.height=Math.ceil(w*n+h*c);
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.translate(cv.width/2,cv.height/2);ctx.rotate(r);ctx.drawImage(img,-w/2,-h/2,w,h);
  return cv;
}

// Ảnh chụp tay thường nghiêng: thử xoay 0/22/45/67° (bộ đọc tự lo phần 90°) ở vài độ phân giải
async function decodeImageRobust(img){
  const cv=document.createElement("canvas"),angles=[0,22.5,45,67.5];
  const bd=await getBarcodeDetector();
  if(bd){
    for(const max of [1280,1920,800])for(const deg of angles){
      drawScaledRotated(img,max,deg,cv);
      try{const r=await bd.detect(cv);if(r.length)return r[0].rawValue;}catch(e){}
    }
    return null;
  }
  const Z=await loadZXingLib();if(!Z?.MultiFormatReader)return null;
  const hints=zxHints(),reader=new Z.MultiFormatReader();reader.setHints(hints);
  for(const max of [1280,800,1920])for(const deg of angles){
    drawScaledRotated(img,max,deg,cv);
    try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))),hints).getText();}catch(e){}
    await new Promise(r=>setTimeout(r));
  }
  return null;
}
