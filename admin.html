const CLOUD_COLS=["products","categories","suppliers","customers","transactions","bills","orders"];
// Tồn kho và điểm gửi lên dạng cộng/trừ chênh lệch: 2 máy cùng bán một lúc vẫn trừ kho đúng
const INC_FIELDS={products:["stock"],customers:["points"]};
// Trang khách chỉ đọc bản sao này, không thấy giá nhập
const PUBLIC_FIELDS=["id","name","price","category","image","stock","lowStock","sku","note","brand","origin","volume","skinType","ingredients","usage"];
const CLOUD_USER_KEY="myphamHH_cloudUser";
let cloudSynced={},cloudUnsubs=[],cloudLoaded=new Set(),cloudReady=false,cloudPending=0,cloudFailed=false,cloudDirty=false,cloudRaf=0,cloudUser="";

function stableJSON(v){
  if(Array.isArray(v))return"["+v.map(stableJSON).join(",")+"]";
  if(v&&typeof v==="object")return"{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stableJSON(v[k])).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}

// So DB hiện tại với bản đã đồng bộ, chỉ gửi những gì thay đổi
function cloudDiffOps(){
  const ops=[];
  for(const col of CLOUD_COLS){
    const prev=cloudSynced[col]||(cloudSynced[col]={}),seen=new Set(),incF=INC_FIELDS[col]||[];
    for(const r of DB[col]||[]){
      if(!r||!r.id)continue;
      seen.add(r.id);
      const s=stableJSON(r);if(prev[r.id]===s)continue;
      const now=JSON.parse(JSON.stringify(r));let op;
      if(!prev[r.id])op={op:"set",col,id:r.id,data:now};
      else{
        const old=JSON.parse(prev[r.id]),data={},inc={};
        for(const k of Object.keys(now)){
          if(stableJSON(now[k])===stableJSON(old[k]))continue;
          if(incF.includes(k)&&typeof now[k]==="number"&&typeof old[k]==="number")inc[k]=now[k]-old[k];
          else data[k]=now[k];
        }
        op={op:"set",col,id:r.id,data,merge:true,inc,del:Object.keys(old).filter(k=>!(k in now))};
      }
      ops.push(op);prev[r.id]=s;
      if(col==="products"){const c=catalogOp(op);if(c)ops.push(c);}
    }
    for(const id of Object.keys(prev))if(!seen.has(id)){
      ops.push({op:"del",col,id});
      if(col==="products")ops.push({op:"del",col:"catalog",id});
      delete prev[id];
    }
  }
  return ops;
}
function catalogOp(op){
  const pick=o=>{const r={};for(const f of PUBLIC_FIELDS)if(o&&f in o)r[f]=o[f];return r;};
  const c={op:"set",col:"catalog",id:op.id,data:pick(op.data),merge:!!op.merge,inc:pick(op.inc),del:(op.del||[]).filter(f=>PUBLIC_FIELDS.includes(f))};
  if(c.merge&&!Object.keys(c.data).length&&!Object.keys(c.inc).length&&!c.del.length)return null;
  return c;
}

// Ghi đè tại chỗ để form đang mở vẫn giữ đúng đối tượng
function cloudApply(col,changes){
  const arr=DB[col]||(DB[col]=[]),prev=cloudSynced[col]||(cloudSynced[col]={});
  for(const c of changes){
    const i=arr.findIndex(x=>x.id===c.id);
    if(c.type==="removed"){if(i>=0)arr.splice(i,1);delete prev[c.id];continue;}
    const data=Object.assign({},c.data,{id:c.id});
    let rec=data;
    if(i>=0){rec=arr[i];for(const k of Object.keys(rec))if(!(k in data))delete rec[k];Object.assign(rec,data);}
    else arr.push(rec);
    prev[c.id]=stableJSON(rec);
  }
}

function cloudSave(){
  if(!cloudReady)return;
  const ops=cloudDiffOps();if(!ops.length)return;
  cloudPending++;updateSyncDot();
  CB.commit(ops).then(()=>{cloudFailed=false;},e=>{cloudFailed=true;toast("Không lưu được lên máy chủ: "+cloudErrText(e));})
    .finally(()=>{cloudPending--;updateSyncDot();});
}
function cloudErrText(e){
  const c=(e&&e.code)||"";
  if(/permission/.test(c))return"tài khoản không có quyền";
  if(/unavailable|network/.test(c))return"mất mạng";
  return c||(e&&e.message)||"lỗi không rõ";
}
function authErrMsg(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return"Sai email hoặc mật khẩu.";
  if(/invalid-email/.test(c))return"Email không hợp lệ.";
  if(/too-many-requests/.test(c))return"Thử sai quá nhiều lần, vui lòng đợi vài phút.";
  if(/network/.test(c))return"Không có mạng, kiểm tra kết nối rồi thử lại.";
  if(/user-disabled/.test(c))return"Tài khoản đã bị khoá.";
  return"Lỗi đăng nhập: "+(c||(e&&e.message)||"");
}

}

function cloudRerender(){

    cloudUnsubs.push(CB.listen(col,changes=>{
      cloudApply(col,changes);

      document.getElementById("content").innerHTML=`<div class="empty"><div class="big">⚠️</div><h3>${perm?"Tài khoản này không có quyền quản lý cửa hàng":"Không kết nối được máy chủ"}</h3><p class="muted">${esc(perm?cloudUser:cloudErrText(err))}</p><button class="btn primary" onclick="cloudLogout()">Đăng nhập tài khoản khác</button></div>`;
    }));
  }
}
function cloudStop(){cloudUnsubs.forEach(u=>{try{u();}catch(e){}});cloudUnsubs=[];cloudReady=false;}

function orderStockProblem(o){
  for(const it of o.items||[]){
    const p=productById(it.productId);
    if(!p)return`Mặt hàng "${it.name}" không còn trong kho`;
    if(p.stock<it.qty)return`Không đủ hàng: ${p.name} chỉ còn ${p.stock}`;
  }
  return"";
}
function confirmOrder(id){

  confirmModal("Xác nhận đơn?",`Trừ kho và ghi nhận bán <b>${money(o.total)}</b> cho <b>${esc(o.name)}</b>?`,()=>{
    const cur=byId(DB.orders,id);if(!cur||cur.status!=="new"){toast("Đơn này vừa được xử lý ở máy khác");return;}
    const prob2=orderStockProblem(cur);if(prob2){toast(prob2);return;}
    let cust=DB.customers.find(c=>c.phone&&normPhone(c.phone)===normPhone(cur.phone));
    if(!cust){cust={id:uid(),name:cur.name,phone:cur.phone,address:cur.address||"",note:"Khách đặt online",points:0,pointsHistory:[]};DB.customers.push(cust);}
    else if(!cust.address&&cur.address)cust.address=cur.address;
    const today=new Date().toISOString().slice(0,10);
    for(const it of cur.items){
      const p=productById(it.productId);p.stock-=it.qty;
      DB.transactions.push({id:uid(),type:"sale",date:today,productId:p.id,qty:it.qty,unitPrice:it.price,unitCost:p.cost,partyId:cust.id,orderId:cur.id,note:"[Online]"+(cur.note?" "+cur.note:"")});
    }
    cur.status="done";cur.doneAt=Date.now();cur.customerId=cust.id;
    save();toast("✓ Đã xác nhận đơn, kho đã trừ");go(current);
  });
}

let _ac=null;
function ding(){
  try{
    _ac=_ac||new(window.AudioContext||window.webkitAudioContext)();_ac.resume&&_ac.resume();
    const t=_ac.currentTime;
    [880,1320].forEach((f,i)=>{const o=_ac.createOscillator(),g=_ac.createGain(),s=t+i*.18;o.frequency.value=f;o.connect(g);g.connect(_ac.destination);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.25);o.start(s);o.stop(s+.3);});
  }catch(e){}
  try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate([200,100,200]);}catch(e){}
}

function shrinkImage(src,max=480,q=0.75){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>res(src);
    img.src=src;
  });
}
const shrinkDataImage=src=>src&&String(src).startsWith("data:")&&src.length>150000?shrinkImage(src):Promise.resolve(src);
function localBackup(){try{const d=JSON.parse(localStorage.getItem(DB_KEY)||"null");return d&&typeof d==="object"?d:null;}catch(e){return null;}}

function cloudUploadLocal(){
  const L=localBackup();if(!L){toast("Máy này không có dữ liệu cũ");return;}
  const pid={},cid={},sid={},map=(m,id)=>m[id]||id;
  // Mặt hàng trùng mã vạch, khách/NCC trùng số điện thoại: gộp vào bản đã có trên máy chủ
  const prods=[],custs=[],sups=[];
  for(const p of L.products||[]){if(!p||!p.id||byId(DB.products,p.id))continue;const d=p.sku&&findProductByCode(p.sku);if(d)pid[p.id]=d.id;else prods.push({...p});}
  for(const c of L.customers||[]){if(!c||!c.id||byId(DB.customers,c.id))continue;const d=c.phone&&DB.customers.find(x=>x.phone&&normPhone(x.phone)===normPhone(c.phone));if(d)cid[c.id]=d.id;else custs.push({...c});}
  for(const s of L.suppliers||[]){if(!s||!s.id||byId(DB.suppliers,s.id))continue;const d=s.phone&&DB.suppliers.find(x=>x.phone&&normPhone(x.phone)===normPhone(s.phone));if(d)sid[s.id]=d.id;else sups.push({...s});}
  const cats=(L.categories||[]).filter(c=>c&&c.id&&!byId(DB.categories,c.id)&&!DB.categories.some(x=>x.name===c.name));
  const txns=(L.transactions||[]).filter(t=>t&&t.id&&!byId(DB.transactions,t.id)).map(t=>({...t,productId:map(pid,t.productId),partyId:t.type==="sale"?map(cid,t.partyId):map(sid,t.partyId)}));
  const bills=(L.bills||[]).filter(b=>b&&b.id&&!byId(DB.bills,b.id)).map(b=>({...b,customerId:map(cid,b.customerId),items:(b.items||[]).map(i=>({...i,productId:map(pid,i.productId)}))}));
  const total=prods.length+custs.length+sups.length+cats.length+txns.length+bills.length;
  if(!total){toast("Dữ liệu trên máy này đã có đủ trên máy chủ");return;}
  confirmModal("Đưa dữ liệu lên máy chủ?",`Sẽ thêm <b>${prods.length}</b> mặt hàng, <b>${cats.length}</b> danh mục, <b>${custs.length}</b> khách hàng, <b>${sups.length}</b> nhà cung cấp, <b>${txns.length}</b> giao dịch, <b>${bills.length}</b> hóa đơn.<br><span class="muted">Mặt hàng trùng mã vạch, khách trùng số điện thoại được gộp với dữ liệu đã có.</span>`,async()=>{
    toast("Đang tải lên…");
    for(const p of prods){p.image=await shrinkDataImage(p.image);p.supplierId=map(sid,p.supplierId);}
    DB.products.push(...prods);DB.categories.push(...cats);DB.customers.push(...custs);DB.suppliers.push(...sups);DB.transactions.push(...txns);DB.bills.push(...bills);
    save();go(current);toast(`✓ Đã đưa ${total} mục lên máy chủ`);
  });
}
function cloudRebuildCatalog(){
  if(!DB.products.length){toast("Chưa có mặt hàng");return;}
  const ops=DB.products.map(p=>{const d={};for(const f of PUBLIC_FIELDS)if(f in p)d[f]=p[f];return{op:"set",col:"catalog",id:p.id,data:JSON.parse(JSON.stringify(d))};});

function addToCart(id){
  if(!cart[id])cart[id]=1;
  updateCartUI();
}

function changeCartQty(id,delta){
  const p=productById(id);if(!p)return;
  const cur=cart[id]||0;
  const newQty=Math.max(0,Math.min(p.stock,cur+delta));
  if(newQty===0)delete cart[id];else cart[id]=newQty;
  // update this card's display inline
  const qv=document.getElementById("qv_"+id);if(qv)qv.textContent=cart[id]||0;
  const ab=document.getElementById("ab_"+id);if(ab){ab.textContent=cart[id]?"✓ Đã thêm":"Thêm vào giỏ";ab.classList.toggle("added",!!cart[id]);}
  updateCartUI();
}

function cartCount(){return Object.values(cart).reduce((s,q)=>s+q,0);}
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=productById(id);return s+(p?p.price*q:0);},0);}

function updateCartUI(){
  const count=cartCount(),total=cartTotal();
  // badge
  const badge=document.getElementById("cartBadge");
  if(badge){badge.textContent=count;badge.style.display=count>0?"grid":"none";}
  // bar
  const bar=document.getElementById("cartBar");
  if(bar){
    bar.classList.toggle("show",count>0);
    const cnt=document.getElementById("cartBarCount");if(cnt)cnt.textContent=count+" sản phẩm";
    const tot=document.getElementById("cartBarTotal");if(tot)tot.textContent=money(total);
  }
}

function submitOrder(){
  const name=document.getElementById("coName").value.trim();
  const phone=document.getElementById("coPhone").value.trim();
  const note=document.getElementById("coNote").value.trim();
  if(!name){toast("Vui lòng nhập họ tên");return;}
  if(!phone){toast("Vui lòng nhập số điện thoại");return;}
  // Find or create customer
  let cust=DB.customers.find(c=>c.phone===phone||c.name===name);
  if(!cust){cust={id:uid(),name,phone,address:"",note:""};DB.customers.push(cust);}
  else{if(!cust.phone&&phone)cust.phone=phone;}
  // Create sale transactions
  const today=new Date().toISOString().slice(0,10);
  Object.entries(cart).forEach(([productId,qty])=>{
    const p=productById(productId);if(!p||qty<=0)return;
    const actualQty=Math.min(qty,p.stock);if(actualQty<=0)return;
    DB.transactions.push({id:uid(),type:"sale",date:today,productId,qty:actualQty,unitPrice:p.price,unitCost:p.cost,partyId:cust.id,note:note||"Đơn qua cửa hàng online"});
    p.stock-=actualQty;
  });
  save();
  const total=cartTotal(); // capture before clearing
  cart={};updateCartUI();
  // Success screen
  document.getElementById("modalMount").innerHTML=`<div class="modal-back"><div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:32px 24px">
      <div style="font-size:52px;margin-bottom:14px">🎉</div>

      <p class="muted">Cảm ơn <b>${esc(name)}</b> đã mua hàng.</p>
      <p class="muted">Chúng tôi sẽ liên hệ lại qua số <b>${esc(phone)}</b>.</p>
      <div style="background:var(--surface-2);border-radius:12px;padding:14px;margin:18px 0;font-size:15px">
        Tổng đơn hàng: <b style="font-family:'Fraunces',serif;font-size:20px;color:var(--rose-deep)">${money(total)}</b>
      </div>
      <button class="btn primary" style="width:100%" onclick="document.getElementById('modalMount').innerHTML='';renderStoreGrid()">Tiếp tục mua hàng</button>
    </div>
  </div></div>`;
  renderStoreGrid();
}

    <div class="modal-head"><h2>${cat?"Sửa danh mục":"Thêm danh mục"}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Tên danh mục *</label><input id="cName" value="${cat?esc(cat.name):""}" placeholder="VD: Son môi, Kem dưỡng..."></div>
      <div class="field"><label>Biểu tượng</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
          ${icons.map(ic=>`<button type="button" onclick="pickCatIcon(this,'${ic}')" style="width:42px;height:42px;border-radius:8px;border:2px solid ${ic===curIcon?"var(--plum)":"var(--line)"};background:${ic===curIcon?"var(--plum-soft,#f3e8ff)":"var(--surface-2)"};cursor:pointer;font-size:20px;transition:.15s">${ic}</button>`).join("")}
        </div>
        <input type="hidden" id="cIcon" value="${esc(curIcon)}">
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Huỷ</button><button class="btn primary" onclick="saveCategory('${id||""}')">Lưu danh mục</button></div>
  </div>`);
}
function pickCatIcon(btn,icon){
  document.getElementById("cIcon").value=icon;
  document.querySelectorAll("#modalMount button[onclick^='pickCatIcon']").forEach(b=>{
    b.style.border="2px solid var(--line)";b.style.background="var(--surface-2)";
  });
  btn.style.border="2px solid var(--plum)";btn.style.background="var(--plum-soft,#f3e8ff)";
}
function saveCategory(id){
  if(!DB.categories)DB.categories=[];
  const name=document.getElementById("cName").value.trim();
  if(!name){toast("Vui lòng nhập tên danh mục");return;}
  const icon=document.getElementById("cIcon").value||"🏷";
  if(id){
    const cat=DB.categories.find(c=>c.id===id);
    if(cat){
      const oldName=cat.name;
      cat.name=name;cat.icon=icon;
      if(oldName!==name)DB.products.forEach(p=>{if(p.category===oldName)p.category=name;});
    }
  }else{
    if(DB.categories.some(c=>c.name===name)){toast("Danh mục này đã tồn tại");return;}
    DB.categories.push({id:uid(),name,icon});
  }
  save();closeModal();toast(id?"Đã cập nhật danh mục":"Đã thêm danh mục");go("categories");
}
function delCategory(id){
  if(!DB.categories)return;
  const cat=DB.categories.find(c=>c.id===id);if(!cat)return;
  const count=DB.products.filter(p=>p.category===cat.name).length;
  confirmModal("Xoá danh mục?",`Xoá danh mục <b>${esc(cat.name)}</b>?${count?`<br><span class='muted'>${count} sản phẩm sẽ không còn thuộc danh mục này.</span>`:""}`,()=>{
    DB.categories=DB.categories.filter(c=>c.id!==id);
    save();toast("Đã xoá danh mục");go("categories");
  });
}

window.go=go;window.openProductModal=openProductModal;window.openTxnModal=openTxnModal;
window.openPartyModal=openPartyModal;window.delProduct=delProduct;window.delTxn=delTxn;window.delParty=delParty;
window.openQRCode=openQRCode;window.openQRScanner=openQRScanner;window.stopQR=stopQR;
window.openCategoryModal=openCategoryModal;window.saveCategory=saveCategory;window.delCategory=delCategory;window.pickCatIcon=pickCatIcon;

/* ======= ORDER NOTIFICATION SYSTEM ======= */
const NOTIFY_KEY='myphamHH_notify';
const SEEN_KEY='myphamHH_lastSeen';
let unreadCount=0;

function money2(n){return new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n||0);}

function updateBadge(){
  const el=document.getElementById("navBadge");
  if(!el)return;
  if(unreadCount>0){el.textContent=unreadCount>99?"99+":unreadCount;el.style.display="inline-block";}
  else el.style.display="none";
}

function showOrderAlert(order){
  document.querySelectorAll(".order-alert").forEach(e=>e.remove());
  const div=document.createElement("div");
  div.className="order-alert";
  div.innerHTML=`<div class="order-alert-ico">🛒</div>
    <div class="order-alert-body">
      <div class="order-alert-title">Đơn hàng mới! ${order.name||""} – ${order.phone||""}</div>
      <div class="order-alert-sub">Tổng tiền: ${money2(order.total)} · Nhấn để xem ${CLOUD?"đơn":"giao dịch"}</div>
    </div>
    <button class="order-alert-close" onclick="this.parentElement.remove()">✕</button>`;
  div.addEventListener("click",e=>{
    if(e.target.classList.contains("order-alert-close"))return;
    div.remove();go(CLOUD?"orders":"transactions");
  });
  document.body.appendChild(div);
  setTimeout(()=>{if(div.parentNode)div.remove();},12000);
}

function checkUnreadOnLoad(){
  if(CLOUD)return;
  try{
    const lastSeen=parseInt(localStorage.getItem(SEEN_KEY)||"0");
    const db=loadDB();if(!db)return;
    const newSales=(db.transactions||[]).filter(t=>t.type==="sale"&&t.note&&t.note.includes("[Online]")&&new Date(t.date).getTime()>(lastSeen-86400000));
    unreadCount=newSales.length;
    updateBadge();
  }catch(e){}
}

window.addEventListener("storage",e=>{
  if(CLOUD||e.key!==NOTIFY_KEY||!e.newValue)return;
  try{
    const order=JSON.parse(e.newValue);
    if(order.type!=="new_order")return;
    unreadCount++;
    updateBadge();
    showOrderAlert(order);
    if(current==="transactions")renderTransactions();
    if(current==="dashboard")go("dashboard");
  }catch(err){}
});

// Trang khách hoặc tab admin khác vừa ghi dữ liệu: nạp lại, nếu không lần lưu sau sẽ ghi đè mất đơn mới
window.addEventListener("storage",e=>{
  if(CLOUD||e.key!==DB_KEY||!e.newValue)return;
  DB=loadDB();
  if(document.getElementById("appWrap").hidden||document.getElementById("modalMount").firstElementChild)return;
  const y=window.scrollY;go(current);window.scrollTo(0,y);
});

checkUnreadOnLoad();
</script>
