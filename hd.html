<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c64f7b">
<meta name="robots" content="noindex">
<title>Hóa đơn điện tử – Hoàng Hiền Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
</head>
<body>
<style>
:root{
  --rose:#c64f7b;--rose-deep:#a83a63;--plum:#4a2545;
  --bg:#fdf5f8;--surface:#fffbfd;--surface-2:#f9edf3;--line:#f0dce6;
  --ink:#2e1a27;--ink-soft:#8a6478;--good:#2a9e68;--warn:#c9791f;--bad:#c53b3b;
  --shadow:0 8px 28px rgba(74,37,69,.12);color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:460px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.head{background:linear-gradient(135deg,#6a1040,#9a2060);color:#fff;padding:18px 18px 16px;text-align:center}
.shop{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:21px}
.shop-sub{font-size:12.5px;opacity:.9;margin-top:2px}
.title{margin-top:12px;font-weight:700;letter-spacing:.08em;font-size:13px;opacity:.95}
.body{padding:16px 18px}
.meta{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.meta>div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.meta>div:first-child{border-top:0}
.meta span{color:var(--ink-soft)}
.meta b{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:12.5px;font-weight:700}
.pill.ok{background:#e4f4ec;color:var(--good)}.pill.warn{background:#fbeed9;color:var(--warn)}.pill.bad{background:#f8e2e2;color:var(--bad)}
.items{width:100%;border-collapse:collapse}
.items th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);text-align:left;padding:6px 2px;border-bottom:1px solid var(--line)}
.items td{padding:10px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.items .r{text-align:right;white-space:nowrap}
.name{font-weight:600}
.sub{font-size:12px;color:var(--ink-soft)}
.sum{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .total{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.sum .total span:last-child{color:var(--rose-deep)}
.note{margin-top:12px;font-size:13px;color:var(--ink-soft)}
.cancel{margin:0 0 14px;padding:12px;border-radius:12px;background:#f8e2e2;color:var(--bad);font-weight:700;text-align:center}
.vqr{display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#f8fcff;margin-top:14px}
.vqr-h{font-weight:700;color:var(--plum);font-size:15px;text-align:center}
.vqr-img{width:min(300px,80vw);height:auto;aspect-ratio:540/640;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.vqr-amt{font-family:"Playfair Display",serif;font-weight:700;font-size:22px;color:var(--rose-deep);text-align:center}
.vqr-info{width:100%;max-width:340px;display:flex;flex-direction:column;gap:5px;background:var(--surface);border-radius:10px;padding:10px 12px}
.vqr-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.vqr-row span{color:var(--ink-soft)}
.vqr-row b{text-align:right;font-variant-numeric:tabular-nums}
.foot{padding:14px 18px 18px;text-align:center;border-top:1px dashed var(--line)}
.thanks{font-family:"Playfair Display",Georgia,serif;font-size:17px;color:var(--plum)}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.stored{font-size:12px;color:var(--ink-soft);margin-top:12px}
.msg{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.msg .ico{font-size:40px;margin-bottom:8px}
@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:0}
  .head{background:none;color:#000;border-bottom:1px dashed #000}
  .actions,.stored{display:none}
}
</style>

<div class="wrap" id="app"><div class="msg"><div class="ico">🧾</div>Đang tải hóa đơn…</div></div>

<script src="firebase-config.js?v=2"></script>
<script src="cloud.js?v=3"></script>
<script>
"use strict";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const fmt=n=>(Math.round(n||0)).toLocaleString("vi-VN");
const money=n=>fmt(n)+"₫";
const app=document.getElementById("app");
const fail=(ico,msg)=>{app.innerHTML=`<div class="msg"><div class="ico">${ico}</div>${msg}</div>`;};

function render(r){
  document.title=`Hóa đơn ${r.code} – ${r.shop.name}`;
  const pay=r.status==="cancelled"?`<span class="pill bad">Đã huỷ</span>`
    :r.paid?`<span class="pill ok">✓ Đã thanh toán${r.payMethod==="transfer"?" · Chuyển khoản":r.payMethod==="cash"?" · Tiền mặt":""}</span>`
    :`<span class="pill warn">⏳ Chưa thanh toán</span>`;
  const tel=String(r.shop.phone||"").replace(/\D/g,"");
  app.innerHTML=`<div class="card">
    <div class="head">
      <div class="shop">${esc(r.shop.name)}</div>
      <div class="shop-sub">${esc(r.shop.address)}<br>ĐT/Zalo: ${esc(r.shop.phone)}</div>
      <div class="title">HÓA ĐƠN BÁN HÀNG</div>
    </div>
    <div class="body">
      ${r.status==="cancelled"?`<div class="cancel">Hóa đơn này đã bị huỷ</div>`:""}
      <div class="meta">
        <div><span>Số hóa đơn</span><b>${esc(r.code)}</b></div>
        <div><span>Thời gian</span><b>${esc(r.when)}</b></div>
        <div><span>Khách hàng</span><b>${esc(r.customer)}${r.phone?` · ${esc(r.phone)}`:""}</b></div>
        <div><span>Thanh toán</span><b>${pay}</b></div>
        ${r.points?`<div><span>Điểm tích luỹ</span><b>+${fmt(r.points)} ⭐</b></div>`:""}
      </div>
      <table class="items"><thead><tr><th>Sản phẩm</th><th class="r">SL</th><th class="r">Thành tiền</th></tr></thead><tbody>
        ${(r.items||[]).map(i=>`<tr><td><div class="name">${esc(i.name)}</div><div class="sub">${money(i.price)}</div></td><td class="r">${fmt(i.qty)}</td><td class="r">${money(i.total)}</td></tr>`).join("")}
      </tbody></table>
      <div class="sum">
        <div><span>Tạm tính</span><span>${money(r.subtotal)}</span></div>
        ${r.discAmt?`<div><span>Giảm giá${r.discLabel?` (${esc(r.discLabel)})`:""}</span><span>-${money(r.discAmt)}</span></div>`:""}
        <div class="total"><span>Tổng cộng</span><span>${money(r.total)}</span></div>
      </div>
      ${r.note?`<div class="note">Ghi chú: ${esc(r.note)}</div>`:""}
      ${!r.paid&&r.status!=="cancelled"&&r.qrUrl&&r.bank?`<div class="vqr">
        <div class="vqr-h">📱 Quét mã để thanh toán</div>
        <img class="vqr-img" src="${esc(r.qrUrl)}" alt="QR chuyển khoản">
        <div class="vqr-amt">${money(r.total)}</div>
        <div class="vqr-info">
          <div class="vqr-row"><span>Ngân hàng</span><b>${esc(r.bank.name||"")}</b></div>
          <div class="vqr-row"><span>Số TK</span><b>${esc(r.bank.acc)}</b></div>
          <div class="vqr-row"><span>Chủ TK</span><b>${esc(r.bank.holder||"")}</b></div>
        </div>
      </div>`:""}
    </div>
    <div class="foot">
      <div class="thanks">Cảm ơn quý khách! ♥</div>
      <div class="actions">
        <button class="btn primary" onclick="window.print()">🖨 In / Lưu PDF</button>
        ${tel?`<a class="btn" href="https://zalo.me/${tel}" target="_blank" rel="noopener">💬 Zalo cửa hàng</a>`:""}
      </div>
      <div class="actions"><a class="btn" href="./">🛍️ Xem sản phẩm khác</a></div>
      <div class="stored">Hóa đơn điện tử được lưu trữ trực tuyến tại ${esc(r.shop.web)}</div>
    </div>
  </div>`;
}

(async()=>{
  const id=new URLSearchParams(location.search).get("id")||"";
  if(!/^[A-Za-z0-9]{16,40}$/.test(id))return fail("🔍","Link hóa đơn không hợp lệ.");
  if(!window.FB_CONFIG||!window.cloudBackend)return fail("⚠️","Hệ thống hóa đơn điện tử chưa sẵn sàng.");
  try{
    await window.cloudBackend.init();
    const r=await window.cloudBackend.get("receipts",id);
    if(!r)return fail("🔍","Không tìm thấy hóa đơn. Vui lòng kiểm tra lại link.");
    render(r);
  }catch(e){fail("📶","Không tải được hóa đơn, vui lòng kiểm tra mạng rồi tải lại trang.");}
})();
</script>
</body>
</html>
